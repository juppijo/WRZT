<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WRZNT - Wellen-Interferenz & Quellen</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        canvas { background: #000; cursor: crosshair; }
        .ui-overlay { position: absolute; top: 20px; left: 20px; background: rgba(0, 20, 20, 0.85); padding: 20px; border-radius: 5px; border-left: 4px solid #00ffcc; z-index: 10; width: 250px; pointer-events: auto; }
        .source-display { position: absolute; top: 20px; right: 20px; text-align: right; color: #ff3366; font-weight: bold; pointer-events: none; }
        label { display: block; margin-top: 10px; font-size: 0.75em; text-transform: uppercase; }
        input { width: 100%; accent-color: #00ffcc; }
        .formula { font-size: 0.85em; margin-top: 15px; color: #fff; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

<div class="ui-overlay">
    <div style="font-size: 1.2em; margin-bottom: 5px;">WRZT VISUALIZER</div>
    <div style="font-size: 0.7em; color: #008877; margin-bottom: 15px;">Interferenz-Gitter v1.2</div>
    
    <label>Wellenlänge (λ)</label>
    <input type="range" id="waveLength" min="10" max="150" value="45">
    
    <label>Interferenz-Intensität</label>
    <input type="range" id="intensity" min="0.1" max="2" step="0.1" value="1">

    <div class="formula">
        $$r_e = \frac{k \cdot e^2}{m_e c^2}$$
    </div>
</div>

<div class="source-display" id="sourceTag">
    QUELLEN-EMISSION [ACTIVE]<br>
    <span style="font-size: 0.7em; color: #00ffcc;">Position: Oben Rechts</span>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const waveLengthInput = document.getElementById('waveLength');
    const intensityInput = document.getElementById('intensity');

    let width, height, time = 0;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, width, height);
        time += 0.05;

        const λ = parseFloat(waveLengthInput.value);
        const globalInt = parseFloat(intensityInput.value);
        
        // Quellen oben rechts positionieren
        const s1 = { x: width - 80, y: 80 };
        const s2 = { x: width - 180, y: 120 };

        const step = 5;
        for (let x = 0; x < width; x += step) {
            for (let y = 0; y < height; y += step) {
                const d1 = Math.sqrt((x - s1.x) ** 2 + (y - s1.y) ** 2);
                const d2 = Math.sqrt((x - s2.x) ** 2 + (y - s2.y) ** 2);

                const w1 = Math.sin((d1 / λ) - time);
                const w2 = Math.sin((d2 / λ) - time);
                
                const combined = (w1 + w2) * globalInt;
                
                if (combined > 0) {
                    // Blau-Verschiebung bei hoher Intensität
                    const b = Math.floor(100 + combined * 70);
                    const r = Math.floor(combined * 50);
                    ctx.fillStyle = `rgba(${r}, ${Math.floor(b/2)}, ${b}, ${Math.abs(combined) * 0.6})`;
                } else {
                    // Rot-Verschiebung bei niedriger Intensität (Minima)
                    const r = Math.floor(150 + combined * -50);
                    ctx.fillStyle = `rgba(${r}, 20, 50, ${Math.abs(combined) * 0.4})`;
                }
                ctx.fillRect(x, y, step, step);
            }
        }

        // Zeichne die Quellen oben rechts
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff3366";
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(s1.x, s1.y, 4, 0, Math.PI * 2);
        ctx.arc(s2.x, s2.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        requestAnimationFrame(draw);
    }

    draw();
</script>

<!-- MathJax für die Darstellung der Formel -->
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</body>
</html>
