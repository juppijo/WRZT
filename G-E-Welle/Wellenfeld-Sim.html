<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WRZT - Bugwellen Simulation</title>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        canvas { border: 1px solid #444; box-shadow: 0 0 20px rgba(0,255,255,0.2); cursor: crosshair; }
        .controls { margin: 20px; display: grid; grid-template-columns: 1fr 200px; gap: 10px; background: #111; padding: 15px; border-radius: 8px; }
        label { font-size: 0.9em; color: #0ff; }
        .manifest-ref { font-style: italic; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Wellenraumzeit-Netz: Bugwellen-Interferenz</h2>
    <p class="manifest-ref">WRZT - Kapitel: Dynamische Singularitäten & die Ur-Spannung &Xi;</p>
    
    <canvas id="waveCanvas" width="500" height="500"></canvas>

    <div class="controls">
        <label>Rotation (&omega;):</label>
        <input type="range" id="omega" min="0" max="10" step="0.1" value="3">
        
        <label>Wellen-Geschw. (c):</label>
        <input type="range" id="c_speed" min="1" max="15" step="0.5" value="7">
        
        <label>Orbit-Radius (a):</label>
        <input type="range" id="radius" min="0.5" max="4" step="0.1" value="1.5">
    </div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.createImageData(width, height);

        let t = 0;

        function draw() {
            const omega = parseFloat(document.getElementById('omega').value);
            const c = parseFloat(document.getElementById('c_speed').value);
            const a = parseFloat(document.getElementById('radius').value);
            const M = (a * omega) / c; // Mach-Zahl der Raumzeit

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    // Normalisierte Koordinaten (-10 bis 10)
                    const nx = (x - width / 2) / 25;
                    const ny = (y - height / 2) / 25;

                    // Positionen der Quellen
                    const s1x = a * Math.cos(omega * t);
                    const s1y = a * -Math.sin(omega * t);
                    const s2x = -s1x;
                    const s2y = -s1y;

                    // Abstände
                    const dx1 = nx - s1x; const dy1 = ny - s1y;
                    const r1 = Math.sqrt(dx1*dx1 + dy1*dy1) + 0.1;
                    const dx2 = nx - s2x; const dy2 = ny - s2y;
                    const r2 = Math.sqrt(dx2*dx2 + dy2*dy2) + 0.1;

                    // Doppler-Winkel (Bugwelle)
                    const ang1 = Math.atan2(dy1, dx1) - (-omega * t + Math.PI/2);
                    const ang2 = Math.atan2(dy2, dx2) - (omega * t + 3*Math.PI/2);

                    // Phasenberechnung mit Mach-Kompression
                    const phase1 = omega * (-t - (r1/c) * (1 - M * Math.cos(ang1)));
                    const phase2 = omega * (t - (r2/c) * (1 - M * Math.cos(ang2))) + Math.PI;

                    // Superposition (Psi-Wert)
                    //const psi = (Math.cos(phase1) / r1 + Math.cos(phase2) / r2) * 50;
                    // Nur eine Quelle berechnen (Psi_2 ist Null)
                    const psi = (Math.cos(phase1) / r1) * 60;

                    // Mapping auf Farben (Blau-Rot Schema)
                    const index = (x + y * width) * 4;
                    imgData.data[index] = 127 + psi;     // Rot
                    imgData.data[index + 1] = 150 + psi/2; // Grünanteil
                    imgData.data[index + 2] = 200 - psi;   // Blau
                    imgData.data[index + 3] = 255;         // Alpha
                }
            }
            ctx.putImageData(imgData, 0, 0);
            t += 0.03;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
