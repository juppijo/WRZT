<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRZT - Toroidales Elektronen-Wirbelmodell (3D)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080c14;
            color: #e0e6ed;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(13, 20, 36, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.1rem;
            color: #00d2ff;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 0.8rem;
            color: #8a9ba8;
            margin-bottom: 16px;
            font-weight: 400;
        }
        .control-group {
            margin-bottom: 14px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #c2d1d9;
        }
        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #1a2638;
            border-radius: 2px;
            outline: none;
            accent-color: #00d2ff;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a2638;
            transition: .3s;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: #8a9ba8;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #00d2ff;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #080c14;
        }
        .telemetry-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(13, 20, 36, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            width: 280px;
            backdrop-filter: blur(10px);
            font-family: monospace;
            font-size: 0.8rem;
        }
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .telemetry-value {
            color: #00d2ff;
            font-weight: bold;
        }
        .phase-indicator {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .phase-plus {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .phase-minus {
            background: rgba(255, 0, 85, 0.2);
            color: #ff0055;
            border: 1px solid #ff0055;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h1>WRZT Torus-Elektron</h1>
        <h2>4π / 720° Topologie-Simulation</h2>

        <div class="control-group">
            <label>Hauptradius R<sub>e</sub> (Compton): <span id="re-val">2.0</span></label>
            <input type="range" id="slider-re" min="1.0" max="4.0" step="0.1" value="2.0">
        </div>

        <div class="control-group">
            <label>Schlauchradius r<sub>c</sub>: <span id="rc-val">0.6</span></label>
            <input type="range" id="slider-rc" min="0.1" max="1.2" step="0.05" value="0.6">
        </div>

        <div class="control-group">
            <label>Umlaufgeschwindigkeit c: <span id="speed-val">1.0</span></label>
            <input type="range" id="slider-speed" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="toggle-group">
            <span>Torus-Netz anzeigen</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-mesh" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-group">
            <span>4π-Knotenpfad (2,1)</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-path" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="telemetry-panel">
        <div class="telemetry-row">
            <span>Gesamtdrehung:</span>
            <span class="telemetry-value" id="tele-angle">0°</span>
        </div>
        <div class="telemetry-row">
            <span>Umlauf-Nummer:</span>
            <span class="telemetry-value" id="tele-lap">1 / 2 (360°)</span>
        </div>
        <div class="telemetry-row">
            <span>Quantenphase Ψ:</span>
            <span id="tele-phase" class="phase-indicator phase-plus">+1.0</span>
        </div>
        <div class="telemetry-row">
            <span>Spin S:</span>
            <span class="telemetry-value">ħ / 2 (0.5)</span>
        </div>
        <div class="telemetry-row">
            <span>Geometrie-Invarianz:</span>
            <span class="telemetry-value">(Ξ / η) · R<sub>min</sub> = 1</span>
        </div>
    </div>

    <script>
        // Setup Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080c14, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00d2ff, 2, 50);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        const purpleLight = new THREE.PointLight(0xff00aa, 1.5, 50);
        purpleLight.position.set(0, -5, -5);
        scene.add(purpleLight);

        // Variables
        let R_e = 2.0;
        let r_c = 0.6;
        let speed = 1.0;
        let theta = 0; // Total angle in radians

        // Meshes
        let torusMesh, curveObject, wavePulse, pulseGlow;

        // Create Torus Mesh
        function updateTorusGeometry() {
            if (torusMesh) scene.remove(torusMesh);
            const geometry = new THREE.TorusGeometry(R_e, r_c, 30, 100);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00d2ff,
                wireframe: true,
                transparent: true,
                opacity: 0.15,
                roughness: 0.3,
                metalness: 0.8
            });
            torusMesh = new THREE.Mesh(geometry, material);
            torusMesh.rotation.x = Math.PI / 2;
            scene.add(torusMesh);
        }

        // Create 4-pi (2,1) Torus Knot Path
        function updatePathGeometry() {
            if (curveObject) scene.remove(curveObject);

            const points = [];
            const numSegments = 300;
            for (let i = 0; i <= numSegments; i++) {
                const t = (i / numSegments) * Math.PI * 4; // 0 to 4-pi
                // (2,1) Torus Knot parametric equations
                const x = (R_e + r_c * Math.cos(t / 2)) * Math.cos(t);
                const z = (R_e + r_c * Math.cos(t / 2)) * Math.sin(t);
                const y = r_c * Math.sin(t / 2);
                points.push(new THREE.Vector3(x, y, z));
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeometry = new THREE.TubeGeometry(curve, 300, 0.02, 8, true);
            const tubeMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.6
            });
            curveObject = new THREE.Mesh(tubeGeometry, tubeMaterial);
            scene.add(curveObject);
        }

        // Create Wave Pulse (Particle)
        function createWavePulse() {
            const sphereGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
            wavePulse = new THREE.Mesh(sphereGeo, sphereMat);

            const glowGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.4
            });
            pulseGlow = new THREE.Mesh(glowGeo, glowMat);
            wavePulse.add(pulseGlow);

            scene.add(wavePulse);
        }

        // Initial Build
        updateTorusGeometry();
        updatePathGeometry();
        createWavePulse();

        // UI Event Listeners
        document.getElementById('slider-re').addEventListener('input', (e) => {
            R_e = parseFloat(e.target.value);
            document.getElementById('re-val').innerText = R_e.toFixed(1);
            updateTorusGeometry();
            updatePathGeometry();
        });

        document.getElementById('slider-rc').addEventListener('input', (e) => {
            r_c = parseFloat(e.target.value);
            document.getElementById('rc-val').innerText = r_c.toFixed(2);
            updateTorusGeometry();
            updatePathGeometry();
        });

        document.getElementById('slider-speed').addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = speed.toFixed(1);
        });

        document.getElementById('toggle-mesh').addEventListener('change', (e) => {
            torusMesh.visible = e.target.checked;
        });

        document.getElementById('toggle-path').addEventListener('change', (e) => {
            curveObject.visible = e.target.checked;
        });

        // Telemetry Elements
        const teleAngle = document.getElementById('tele-angle');
        const teleLap = document.getElementById('tele-lap');
        const telePhase = document.getElementById('tele-phase');

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Advance Pulse Angle
            theta += 0.015 * speed;
            if (theta >= Math.PI * 4) {
                theta -= Math.PI * 4; // Loop after 720 degrees
            }

            // Position along (2,1) Torus Knot
            const x = (R_e + r_c * Math.cos(theta / 2)) * Math.cos(theta);
            const z = (R_e + r_c * Math.cos(theta / 2)) * Math.sin(theta);
            const y = r_c * Math.sin(theta / 2);

            wavePulse.position.set(x, y, z);

            // Phase and Lap Telemetry Calculation
            const totalDegrees = Math.floor((theta / (Math.PI * 4)) * 720);
            teleAngle.innerText = totalDegrees + "°";

            if (theta < Math.PI * 2) {
                // First Lap (0 to 360 deg) -> Phase transition from +1 to -1
                teleLap.innerText = "1 / 2 (0° - 360°)";
                telePhase.innerText = "-1.0 (Invertiert)";
                telePhase.className = "phase-indicator phase-minus";
                wavePulse.material.color.setHex(0xff0055);
                pulseGlow.material.color.setHex(0xff0055);
            } else {
                // Second Lap (360 to 720 deg) -> Phase restored to +1
                teleLap.innerText = "2 / 2 (360° - 720°)";
                telePhase.innerText = "+1.0 (Ursprung)";
                telePhase.className = "phase-indicator phase-plus";
                wavePulse.material.color.setHex(0x00ff88);
                pulseGlow.material.color.setHex(0x00ff88);
            }

            // Slowly Rotate Scene for Dynamic View
            if (torusMesh) torusMesh.rotation.z += 0.002;
            if (curveObject) curveObject.rotation.y += 0.002;

            controls.update();
            renderer.render(scene, camera);
        }

        // Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
