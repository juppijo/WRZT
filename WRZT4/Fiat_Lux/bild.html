<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilder-Anzeige</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 680px;
      width: 100%;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #4285f4;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #3367d6;
    }
      .card {
      width: 640px;
      padding: 10px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .card img:hover {
      transform: scale(2); /* Doppel Vergrößerungseffekt beim Drüberfahren */
    }
    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3>WRZT ANNIHILATION</h3>
    <img src="https://i.postimg.cc/3Km4bLRx/image1.jpg" alt="Vorschaubild1">
    <img src="https://i.ibb.co/TMkyh7yh/image1.jpg" alt="Vorschaubild2">
    <p>Elktron und Positron Annihilation</p>
    <a href="https://photos.app.goo.gl/3hPyF3kJh2NVLi5v5" target="_blank" rel="noopener noreferrer" class="btn">
      Bild ansehen
    </a>
  </div>

</body>
</html>
