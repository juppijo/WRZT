<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positronium-Simulation — e⁻ / e⁺ Bahnvektoren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0908;
  --bg2:#111009;
  --panel:#15130fcc;
  --panel-border:#3a3020;
  --gold:#d4af37;
  --gold-dim:#8a7126;
  --electron:#5bb8ff;
  --positron:#ff6a5b;
  --coulomb:#d4af37;
  --centripetal:#8fd6a4;
  --lorentz:#c98bff;
  --text:#ece6d6;
  --text-dim:#9c9584;
  --good:#7fce8c;
  --bad:#e2685c;
  --mono:'Barlow Condensed', sans-serif;
}
[data-theme="gold"]{
  --bg:#0a0908; --bg2:#111009; --panel:#15130fcc; --panel-border:#3a3020;
  --gold:#d4af37; --gold-dim:#8a7126; --electron:#5bb8ff; --positron:#ff6a5b;
  --coulomb:#d4af37; --centripetal:#8fd6a4; --lorentz:#c98bff; --text:#ece6d6; --text-dim:#9c9584;
}
[data-theme="void"]{
  --bg:#050507; --bg2:#0a0a0e; --panel:#0e0e14cc; --panel-border:#2a2a3a;
  --gold:#7ce0ff; --gold-dim:#3d7d94; --electron:#7ce0ff; --positron:#ff5b8a;
  --coulomb:#7ce0ff; --centripetal:#8fd6a4; --lorentz:#d18bff; --text:#e4eef2; --text-dim:#8b98a0;
}
[data-theme="ember"]{
  --bg:#0c0605; --bg2:#140907; --panel:#1a0f0bcc; --panel-border:#4a2a1a;
  --gold:#ff8c42; --gold-dim:#9a5626; --electron:#ffd166; --positron:#ff4d4d;
  --coulomb:#ff8c42; --centripetal:#ffd166; --lorentz:#ff6b9d; --text:#f2e6d8; --text-dim:#a89686;
}
[data-theme="lab"]{
  --bg:#080a09; --bg2:#0e1210; --panel:#0f1512cc; --panel-border:#22392e;
  --gold:#5be0a3; --gold-dim:#2f7d5c; --electron:#5be0ff; --positron:#ffb35b;
  --coulomb:#5be0a3; --centripetal:#5be0ff; --lorentz:#c9a3ff; --text:#dff2e8; --text-dim:#87a498;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); font-family:'Barlow',sans-serif; color:var(--text);}
body{background:radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg) 75%);}

#stage{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;}

.hud{position:fixed; z-index:10; font-family:'Barlow',sans-serif;}

/* Kopfzeile */
.title{
  top:22px; left:26px;
  font-family:'Bebas Neue', sans-serif;
  letter-spacing:1.5px;
  line-height:1;
}
.title h1{margin:0; font-size:26px; color:var(--text); font-weight:400;}
.title h1 span{color:var(--gold);}
.title p{margin:4px 0 0; font-size:12.5px; color:var(--text-dim); font-family:'Barlow',sans-serif; letter-spacing:.2px;}

/* Buttons oben rechts */
.toolbar{top:20px; right:22px; display:flex; gap:8px;}
.btn{
  background:var(--panel); border:1px solid var(--panel-border); color:var(--text);
  padding:9px 14px; border-radius:7px; font-family:'Barlow',sans-serif; font-size:13px; font-weight:600;
  cursor:pointer; backdrop-filter:blur(6px); display:flex; align-items:center; gap:7px;
  transition:border-color .15s ease, transform .1s ease;
}
.btn:hover{border-color:var(--gold-dim);}
.btn:active{transform:scale(.96);}
.btn svg{width:15px; height:15px; stroke:var(--gold); fill:none; stroke-width:2;}

/* Reglerpanel unten */
.controls{
  left:26px; bottom:22px; width:340px;
  background:var(--panel); border:1px solid var(--panel-border); border-radius:12px;
  padding:16px 18px 14px; backdrop-filter:blur(8px);
}
.controls h2{margin:0 0 12px; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px; color:var(--gold); font-weight:400;}
.ctrl-row{margin-bottom:12px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:5px;}
.ctrl-label b{color:var(--text); font-weight:600;}
.ctrl-label .val{color:var(--gold); font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.3px;}
input[type=range]{
  -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--gold-dim), var(--panel-border)); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
  background:var(--gold); border:2px solid var(--bg); cursor:pointer; box-shadow:0 0 6px #0007;
}
input[type=range]::-moz-range-thumb{
  width:15px; height:15px; border-radius:50%; background:var(--gold); border:2px solid var(--bg); cursor:pointer;
}
.presets{display:flex; gap:6px; margin-top:12px;}
.preset-btn{
  flex:1; background:transparent; border:1px solid var(--panel-border); color:var(--text-dim);
  padding:6px 4px; border-radius:6px; font-size:11px; font-family:'Barlow',sans-serif; cursor:pointer;
}
.preset-btn:hover{border-color:var(--gold-dim); color:var(--text);}

/* Datenpanel rechts */
.data-panel{
  top:20px; right:22px; margin-top:56px; width:308px; max-height:calc(100vh - 100px);
  background:var(--panel); border:1px solid var(--panel-border); border-radius:12px;
  padding:6px 0; backdrop-filter:blur(8px); overflow-y:auto;
}
.data-panel::-webkit-scrollbar{width:5px;}
.data-panel::-webkit-scrollbar-thumb{background:var(--panel-border); border-radius:3px;}
.dp-group{padding:10px 18px 12px; border-bottom:1px solid var(--panel-border);}
.dp-group:last-child{border-bottom:none;}
.dp-group h3{margin:0 0 8px; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1px; color:var(--gold); font-weight:400;}
.dp-row{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; gap:10px;}
.dp-row .k{font-size:12px; color:var(--text-dim); white-space:nowrap;}
.dp-row .v{font-family:var(--mono); font-size:13.5px; color:var(--text); font-weight:600; text-align:right;}
.dp-row .v em{color:var(--text-dim); font-style:normal; font-size:11px; margin-left:2px;}
.stability{margin-top:6px; padding:6px 10px; border-radius:6px; font-size:11.5px; text-align:center; font-weight:600;}
.stability.ok{background:#7fce8c22; color:var(--good); border:1px solid #7fce8c55;}
.stability.no{background:#e2685c22; color:var(--bad); border:1px solid #e2685c55;}

.legend{bottom:22px; right:22px; display:flex; flex-direction:column; gap:6px; background:var(--panel); border:1px solid var(--panel-border); border-radius:10px; padding:10px 14px; backdrop-filter:blur(8px);}
.leg-item{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim);}
.leg-swatch{width:14px; height:3px; border-radius:2px;}

.timescale{bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--panel-border); border-radius:20px; padding:7px 16px; font-size:11.5px; color:var(--text-dim); backdrop-filter:blur(8px); white-space:nowrap;}
.timescale b{color:var(--gold); font-family:var(--mono);}

@media (max-width:820px){
  .data-panel{left:26px; right:26px; width:auto; margin-top:0; top:auto; bottom:230px; max-height:32vh;}
  .controls{width:auto; right:26px;}
  .legend{display:none;}
  .title h1{font-size:20px;}
  .timescale{bottom:auto; top:20px; left:50%; font-size:10px; padding:5px 10px;}
}
</style>
</head>
<body data-theme="gold">

<canvas id="stage"></canvas>

<div class="hud title">
  <h1>Positron<span>ium</span> — Bahnvektoren</h1>
  <p>e⁻ / e⁺ Zweikörperbahn · Radius &amp; Geschwindigkeit frei wählbar</p>
</div>

<div class="hud toolbar">
  <button class="btn" id="styleBtn">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18 5 5 0 0 0 0-10 3 3 0 0 1 0-6"/></svg>
    Stil
  </button>
  <button class="btn" id="fsBtn">
    <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    Vollbild
  </button>
</div>

<div class="hud controls">
  <h2>Parameter</h2>
  <div class="ctrl-row">
    <div class="ctrl-label"><b>Radius r (Abstand e⁻–e⁺)</b><span class="val" id="rVal">–</span></div>
    <input type="range" id="rSlider" min="0" max="1000" step="1">
  </div>
  <div class="ctrl-row">
    <div class="ctrl-label"><b>Bahngeschwindigkeit v</b><span class="val" id="vVal">–</span></div>
    <input type="range" id="vSlider" min="0" max="1000" step="1">
  </div>
  <div class="presets">
    <button class="preset-btn" data-preset="ps">Positronium-Grundzustand</button>
    <button class="preset-btn" data-preset="wide">Weite Bahn</button>
    <button class="preset-btn" data-preset="fast">Relativistisch</button>
  </div>
</div>

<div class="hud data-panel" id="dataPanel"></div>

<div class="hud legend">
  <div class="leg-item"><span class="leg-swatch" style="background:var(--electron)"></span>Elektron e⁻</div>
  <div class="leg-item"><span class="leg-swatch" style="background:var(--positron)"></span>Positron e⁺</div>
  <div class="leg-item"><span class="leg-swatch" style="background:var(--coulomb)"></span>Coulombkraft F_C</div>
  <div class="leg-item"><span class="leg-swatch" style="background:var(--centripetal)"></span>Zentripetalkraft F_zp</div>
  <div class="leg-item"><span class="leg-swatch" style="background:var(--lorentz)"></span>Bahngeschwindigkeit v</div>
</div>

<div class="hud timescale" id="timescaleLabel"></div>

<script>
(function(){
"use strict";

/* ---------- Physikalische Konstanten (SI) ---------- */
const k_e   = 8.9875517923e9;      // Coulomb-Konstante, N·m²/C²
const e_c   = 1.602176634e-19;     // Elementarladung, C
const m_e   = 9.1093837015e-31;    // Elektronen-/Positronmasse, kg
const h_pl  = 6.62607015e-34;      // Planck-Konstante, J·s
const c_l   = 2.99792458e8;        // Lichtgeschwindigkeit, m/s
const mu0   = 1.25663706212e-6;    // magn. Feldkonstante, N/A²

/* ---------- Regler: logarithmische Skalen ---------- */
const R_MIN = 1e-11, R_MAX = 5e-9;      // 0.01 nm .. 5 nm (Separation)
const V_MIN = 1e4,   V_MAX = 2.5e7;     // 10 km/s .. 25.000 km/s

function sliderToLog(pos, min, max){ return min * Math.pow(max/min, pos/1000); }
function logToSlider(val, min, max){ return 1000 * Math.log(val/min) / Math.log(max/min); }

const rSlider = document.getElementById('rSlider');
const vSlider = document.getElementById('vSlider');
const rValEl  = document.getElementById('rVal');
const vValEl  = document.getElementById('vVal');
const dataPanel = document.getElementById('dataPanel');
const timescaleLabel = document.getElementById('timescaleLabel');

let r_sep = 1.0585e-10;   // Startwert ≈ Positronium-Grundzustandsradius (2·a0)
let v_orb = 1.094e6;      // Startwert ≈ Bahngeschwindigkeit im Grundzustand

rSlider.value = logToSlider(r_sep, R_MIN, R_MAX);
vSlider.value = logToSlider(v_orb, V_MIN, V_MAX);

function fmt(val, unit, digits=3){
  if(!isFinite(val)) return '—';
  const exp = val.toExponential(digits);
  const [mant, e] = exp.split('e');
  const eNum = parseInt(e,10);
  return `${mant}×10<em>${eNum>=0?'+':''}${eNum}</em> ${unit}`;
}
function fmtPlain(val, unit, digits=3){
  if(!isFinite(val)) return '—';
  const exp = val.toExponential(digits);
  const [mant, e] = exp.split('e');
  const eNum = parseInt(e,10);
  return `${mant}e${eNum} ${unit}`;
}

/* ---------- Physik-Berechnung ---------- */
function computePhysics(r, v){
  const r_p = r / 2;                              // Bahnradius je Teilchen um Schwerpunkt
  const F_coulomb = k_e * e_c * e_c / (r*r);       // Coulombkraft (Betrag)
  const F_zp      = m_e * v * v / r_p;             // notwendige Zentripetalkraft je Teilchen
  const F_lorentz = F_coulomb * (v*v)/(c_l*c_l);   // ≈ F_C·(v/c)² — magnetische Wechselwirkung bewegter Ladungen
  const omega     = v / r_p;                       // Winkelgeschwindigkeit
  const T         = 2*Math.PI / omega;             // Umlaufzeit
  const lambda_dB = h_pl / (m_e * v);              // de-Broglie-Wellenlänge
  const L         = m_e * v * r_p;                 // Drehimpuls je Teilchen
  const E_kin     = 0.5 * m_e * v * v;              // kin. Energie je Teilchen
  const E_pot     = -k_e * e_c * e_c / r;          // potentielle Energie des Systems
  const E_tot     = 2*E_kin + E_pot;               // Gesamtenergie des Systems
  const beta      = v / c_l;
  const ratio     = F_coulomb / F_zp;              // Stabilitätskennzahl (1 = im Gleichgewicht)
  const E_tot_eV  = E_tot / e_c;
  const E_kin_eV  = E_kin / e_c;
  return {r_p,F_coulomb,F_zp,F_lorentz,omega,T,lambda_dB,L,E_kin,E_pot,E_tot,beta,ratio,E_tot_eV,E_kin_eV};
}

function renderDataPanel(p, r, v){
  const stable = Math.abs(p.ratio - 1) < 0.03;
  dataPanel.innerHTML = `
    <div class="dp-group">
      <h3>Kinematik</h3>
      <div class="dp-row"><span class="k">Bahnradius je Teilchen r_p</span><span class="v">${fmt(p.r_p,'m')}</span></div>
      <div class="dp-row"><span class="k">Winkelgeschwindigkeit ω</span><span class="v">${fmt(p.omega,'rad/s')}</span></div>
      <div class="dp-row"><span class="k">Umlaufzeit T</span><span class="v">${fmt(p.T,'s')}</span></div>
      <div class="dp-row"><span class="k">v / c (β)</span><span class="v">${fmt(p.beta,'')}</span></div>
    </div>
    <div class="dp-group">
      <h3>Kräfte (Vektoren, radial/tangential)</h3>
      <div class="dp-row"><span class="k">Coulombkraft F_C</span><span class="v">${fmt(p.F_coulomb,'N')}</span></div>
      <div class="dp-row"><span class="k">Zentripetalkraft F_zp</span><span class="v">${fmt(p.F_zp,'N')}</span></div>
      <div class="dp-row"><span class="k">Lorentzkraft F_L ≈ F_C·β²</span><span class="v">${fmt(p.F_lorentz,'N')}</span></div>
      <div class="stability ${stable?'ok':'no'}">${stable ? '✓ stabile Kreisbahn (F_C ≈ F_zp)' : '✕ keine stabile Bahn — F_C/F_zp = '+p.ratio.toFixed(2)}</div>
    </div>
    <div class="dp-group">
      <h3>Energie &amp; Drehimpuls</h3>
      <div class="dp-row"><span class="k">Kin. Energie E_kin (je Teilchen)</span><span class="v">${fmt(p.E_kin,'J')}</span></div>
      <div class="dp-row"><span class="k">Pot. Energie E_pot (System)</span><span class="v">${fmt(p.E_pot,'J')}</span></div>
      <div class="dp-row"><span class="k">Gesamtenergie E_tot</span><span class="v">${fmt(p.E_tot,'J')}</span></div>
      <div class="dp-row"><span class="k">Gesamtenergie E_tot</span><span class="v">${p.E_tot_eV.toFixed(2)} <em>eV</em></span></div>
      <div class="dp-row"><span class="k">Drehimpuls L (je Teilchen)</span><span class="v">${fmt(p.L,'J·s')}</span></div>
    </div>
    <div class="dp-group">
      <h3>Wellen­eigenschaften</h3>
      <div class="dp-row"><span class="k">De-Broglie-Wellenlänge λ</span><span class="v">${fmt(p.lambda_dB,'m')}</span></div>
    </div>
    <div class="dp-group">
      <h3>Eingabe</h3>
      <div class="dp-row"><span class="k">Abstand r (e⁻–e⁺)</span><span class="v">${fmt(r,'m')}</span></div>
      <div class="dp-row"><span class="k">Bahngeschwindigkeit v</span><span class="v">${fmt(v,'m/s')}</span></div>
    </div>
  `;
}

/* ---------- Canvas / Animation ---------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W,H,cx,cy;
function resize(){
  W = canvas.width  = window.innerWidth  * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  cx = W/2; cy = H/2 - 10*devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

let theta = 0;           // aktueller Bahnwinkel
let lastT = performance.now();
const trail = [];
const TRAIL_MAX = 90;

function themeColor(varName){
  return getComputedStyle(document.body).getPropertyValue(varName).trim();
}

function draw(now){
  const dt = Math.min((now-lastT)/1000, 0.05);
  lastT = now;

  const p = computePhysics(r_sep, v_orb);

  // Sichtbare Winkelgeschwindigkeit: real skaliert, aber für Anschauung begrenzt (Zeitraffer/Zeitlupe)
  const targetVisualOmega = 1.4; // rad/s, angenehme Anschauungsgeschwindigkeit
  const timeScaleFactor = p.omega > 0 ? targetVisualOmega / p.omega : 0;
  theta += p.omega * timeScaleFactor * dt;

  timescaleLabel.innerHTML = `Reale Winkelgeschw. ω = <b>${fmtPlain(p.omega,'rad/s',2)}</b> · Darstellung zeitskaliert (Faktor ${fmtPlain(timeScaleFactor,'',2)}) — nicht maßstabsgetreu`;

  ctx.clearRect(0,0,W,H);

  const scale = Math.min(W,H) * 0.30; // Bildschirm-Bahnradius in px (schematisch, nicht 1:1)
  const ex = cx + Math.cos(theta) * scale;
  const ey = cy + Math.sin(theta) * scale;
  const px = cx - Math.cos(theta) * scale;
  const py = cy - Math.sin(theta) * scale;

  // Bahnkreis
  ctx.strokeStyle = themeColor('--panel-border');
  ctx.lineWidth = 1.5*devicePixelRatio;
  ctx.setLineDash([4*devicePixelRatio,6*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(cx,cy,scale,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);

  // Schwerpunkt
  ctx.fillStyle = themeColor('--gold-dim');
  ctx.beginPath(); ctx.arc(cx,cy,3*devicePixelRatio,0,Math.PI*2); ctx.fill();

  // Spuren
  trail.push({ex,ey,px,py});
  if(trail.length>TRAIL_MAX) trail.shift();
  trail.forEach((t,i)=>{
    const a = i/trail.length*0.35;
    ctx.fillStyle = hexAlpha(themeColor('--electron'), a);
    ctx.beginPath(); ctx.arc(t.ex,t.ey,2.4*devicePixelRatio,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = hexAlpha(themeColor('--positron'), a);
    ctx.beginPath(); ctx.arc(t.px,t.py,2.4*devicePixelRatio,0,Math.PI*2); ctx.fill();
  });

  // Kraftvektoren (radial, Länge log-skaliert zur Anschauung)
  const arrowScale = 46*devicePixelRatio;
  drawArrow(ex,ey, cx,cy, arrowScale, themeColor('--coulomb'), 3);      // Coulomb: e- Richtung Zentrum
  drawArrow(px,py, cx,cy, arrowScale, themeColor('--coulomb'), 3);      // Coulomb: e+ Richtung Zentrum
  drawArrow(ex,ey, cx,cy, arrowScale*0.62, themeColor('--centripetal'), 2, true); // Zentripetal (kürzer, gestrichelt-ähnlich per Breite)

  // Geschwindigkeitsvektoren (tangential)
  const tvx = -Math.sin(theta), tvy = Math.cos(theta);
  drawVec(ex,ey, tvx,tvy, 34*devicePixelRatio, themeColor('--lorentz'));
  drawVec(px,py, -tvx,-tvy, 34*devicePixelRatio, themeColor('--lorentz'));

  // Teilchen
  drawParticle(ex,ey, themeColor('--electron'), 'e⁻', 11*devicePixelRatio);
  drawParticle(px,py, themeColor('--positron'), 'e⁺', 11*devicePixelRatio);

  renderDataPanel(p, r_sep, v_orb);
  requestAnimationFrame(draw);
}

function hexAlpha(color, a){
  // color kommt als rgb()/hex aus CSS var — einfache rgba-Umwandlung über Canvas-Trick
  const d = document.createElement('div');
  d.style.color = color;
  document.body.appendChild(d);
  const rgb = getComputedStyle(d).color.match(/\d+/g);
  document.body.removeChild(d);
  return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
}

function drawParticle(x,y,color,label,rad){
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 14*devicePixelRatio;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = color;
  ctx.font = `${13*devicePixelRatio}px Barlow, sans-serif`;
  ctx.textAlign='center';
  ctx.fillText(label, x, y - rad - 8*devicePixelRatio);
}

function drawArrow(fromX,fromY,toX,toY,len,color,width,dashed){
  const dx = toX-fromX, dy = toY-fromY;
  const d = Math.hypot(dx,dy) || 1;
  const ux=dx/d, uy=dy/d;
  const ex2 = fromX + ux*Math.min(len,d*0.85);
  const ey2 = fromY + uy*Math.min(len,d*0.85);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = width*devicePixelRatio;
  if(dashed) ctx.setLineDash([3*devicePixelRatio,3*devicePixelRatio]);
  ctx.beginPath(); ctx.moveTo(fromX,fromY); ctx.lineTo(ex2,ey2); ctx.stroke();
  ctx.setLineDash([]);
  const ah = 7*devicePixelRatio;
  ctx.beginPath();
  ctx.moveTo(ex2,ey2);
  ctx.lineTo(ex2-ux*ah-uy*ah*0.6, ey2-uy*ah+ux*ah*0.6);
  ctx.lineTo(ex2-ux*ah+uy*ah*0.6, ey2-uy*ah-ux*ah*0.6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawVec(fromX,fromY,ux,uy,len,color){
  drawArrow(fromX,fromY, fromX+ux*len, fromY+uy*len, len, color, 2.5);
}

requestAnimationFrame(draw);

/* ---------- Regler-Events ---------- */
function syncLabels(){
  rValEl.innerHTML = fmt(r_sep,'m',3);
  vValEl.innerHTML = fmt(v_orb,'m/s',3);
}
rSlider.addEventListener('input', e=>{
  r_sep = sliderToLog(+e.target.value, R_MIN, R_MAX);
  syncLabels();
});
vSlider.addEventListener('input', e=>{
  v_orb = sliderToLog(+e.target.value, V_MIN, V_MAX);
  syncLabels();
});
syncLabels();

/* ---------- Presets ---------- */
document.querySelectorAll('.preset-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const p = btn.dataset.preset;
    if(p==='ps'){ r_sep=1.0585e-10; v_orb=1.094e6; }
    if(p==='wide'){ r_sep=1.5e-9; v_orb=2.9e5; }
    if(p==='fast'){ r_sep=3e-11; v_orb=1.6e7; }
    rSlider.value = logToSlider(r_sep, R_MIN, R_MAX);
    vSlider.value = logToSlider(v_orb, V_MIN, V_MAX);
    syncLabels();
  });
});

/* ---------- Vollbild ---------- */
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
});

/* ---------- Stil-Wechsler ---------- */
const themes = ['gold','void','ember','lab'];
let themeIdx = 0;
document.getElementById('styleBtn').addEventListener('click', ()=>{
  themeIdx = (themeIdx+1) % themes.length;
  document.body.setAttribute('data-theme', themes[themeIdx]);
});

})();
</script>
</body>
</html>
