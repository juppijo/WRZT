<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schraubenbewegung & Zirkuläre Welle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0d12;
            color: #e0e6ed;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 20px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.2rem;
            color: #00ffcc;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 0.8rem;
            color: #8a9bb0;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }
        span.val {
            color: #00ffcc;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00ffcc;
            cursor: pointer;
        }
        .stats {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #b0c2de;
        }
        .highlight {
            color: #ff6699;
            font-weight: bold;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-panel">
        <h1>Schrauben-Abstrahlung</h1>
        <p.subtitle>Helikalbewegung eines Elektrons & erzeugte zirkuläre Welle im Raumzeit-Netz</p.subtitle>

        <div class="control-group">
            <label>Zyklotronradius ($R$): <span id="rVal" class="val">2.0</span> m</label>
            <input type="range" id="radius" min="0.5" max="4.0" step="0.1" value="2.0">
        </div>

        <div class="control-group">
            <label>Rotationsfrequenz ($\omega_c$): <span id="wVal" class="val">2.0</span> rad/s</label>
            <input type="range" id="omega" min="0.5" max="5.0" step="0.1" value="2.0">
        </div>

        <div class="control-group">
            <label>Driftgeschwindigkeit ($v_z$): <span id="vVal" class="val">1.5</span> m/s</label>
            <input type="range" id="drift" min="0.0" max="4.0" step="0.1" value="1.5">
        </div>

        <div class="stats" id="calc-output">
            <!-- Dynamische Werte -->
        </div>
    </div>

    <script>
        // Szenen-Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0d12, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Beleuchtung
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00ffcc, 2, 50);
        scene.add(pointLight);

        // Achsen- und Führungslinien
        const gridHelper = new THREE.GridHelper(60, 30, 0x1f293d, 0x111827);
        gridHelper.position.y = -8;
        scene.add(gridHelper);

        // Zentrale Drift-Achse (Z-Achse / Ausbreitung)
        const axisGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, -40),
            new THREE.Vector3(0, 0, 40)
        ]);
        const axisMat = new THREE.LineDashedMaterial({ color: 0x4a5568, dashSize: 0.5, gapSize: 0.5 });
        const axisLine = new THREE.Line(axisGeo, axisMat);
        axisLine.computeLineDistances();
        scene.add(axisLine);

        // 1. Elektron (3D Mesh)
        const electronGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const electronMat = new THREE.MeshStandardMaterial({
            color: 0x00ffcc,
            emissive: 0x00b386,
            roughness: 0.2,
            metalness: 0.8
        });
        const electron = new THREE.Mesh(electronGeo, electronMat);
        scene.add(electron);

        // 2. Trajektorie / Helix-Spur des Elektrons
        const maxTrailPoints = 300;
        const trailPositions = new Float32Array(maxTrailPoints * 3);
        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMat = new THREE.LineBasicMaterial({ color: 0xff6699, transparent: true, opacity: 0.7, linewidth: 2 });
        const trailLine = new THREE.Line(trailGeo, trailMat);
        scene.add(trailLine);

        // 3. Abgestrahlte zirkuläre Welle (Raumzeit-Netz-Spirale)
        const wavePoints = 400;
        const wavePositions = new Float32Array(wavePoints * 3);
        const waveGeo = new THREE.BufferGeometry();
        waveGeo.setAttribute('position', new THREE.BufferAttribute(wavePositions, 3));
        const waveMat = new THREE.LineBasicMaterial({ color: 0x3399ff, transparent: true, opacity: 0.8, linewidth: 2 });
        const waveLine = new THREE.Line(waveGeo, waveMat);
        scene.add(waveLine);

        // UI-Referenzen
        const rInput = document.getElementById('radius');
        const wInput = document.getElementById('omega');
        const vInput = document.getElementById('drift');
        const rVal = document.getElementById('rVal');
        const wVal = document.getElementById('wVal');
        const vVal = document.getElementById('vVal');
        const output = document.getElementById('output');

        let simTime = 0;
        const history = [];

        function animate() {
            requestAnimationFrame(animate);

            // Parameter einlesen
            const R = parseFloat(rInput.value);
            const w = parseFloat(wInput.value);
            const vz = parseFloat(vInput.value);

            rVal.innerText = R.toFixed(1);
            wVal.innerText = w.toFixed(1);
            vVal.innerText = vz.toFixed(1);

            // Beschleunigung $a = R \cdot \omega^2$
            const accel = R * w * w;
            // Relative Larmor-Leistung (proportional zu a^2)
            const relPower = Math.pow(accel, 2);

            document.getElementById('calc-output').innerHTML = `
                <b>Berechnete Parameter:</b><br>
                Zentripetal-Beschleunigung ($a$):<br>
                <span class="highlight">${accel.toFixed(2)} m/s²</span><br>
                Rel. Abstrahlleistung ($\propto a^2$):<br>
                <span class="val">${relPower.toFixed(2)} rel. Einheiten</span><br>
                Polarisation: <span class="val">Zirkulär (Helix)</span>
            `;

            simTime += 0.03;

            // Position des Elektrons berechnen
            const x = R * Math.cos(w * simTime);
            const y = R * Math.sin(w * simTime);
            // Wiederkehrende Z-Koordinate für die Ansicht
            const z = ((vz * simTime) % 30) - 15;

            electron.position.set(x, y, z);
            pointLight.position.set(x, y, z);

            // Historie für die Bahnspur
            history.unshift({ x, y, z });
            if (history.length > maxTrailPoints) history.pop();

            const posAttr = trailGeo.attributes.position;
            for (let i = 0; i < history.length; i++) {
                posAttr.setXYZ(i, history[i].x, history[i].y, history[i].z);
            }
            trailGeo.attributes.position.needsUpdate = true;
            trailGeo.setDrawRange(0, history.length);

            // Abgestrahlte zirkuläre Welle (E-Feldvektoren breiten sich in +Z/-Z aus)
            const waveAttr = waveGeo.attributes.position;
            const waveLength = 40;
            for (let i = 0; i < wavePoints; i++) {
                const fraction = i / wavePoints;
                const waveZ = z + fraction * waveLength; // Welle läuft ab dem Elektron nach hinten
                const phase = w * simTime - fraction * 15;
                const waveR = R * Math.exp(-fraction * 1.5); // Dämpfung mit der Distanz

                const wx = waveR * Math.cos(phase);
                const wy = waveR * Math.sin(phase);

                waveAttr.setXYZ(i, wx, wy, waveZ);
            }
            waveGeo.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
