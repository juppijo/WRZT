<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌀 WRZT</title>

  <!-- MathJax configuration for inline & display math -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)']
        ],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Externes CSS : body, main, header, nav, h1, p etc.) sowie Klassen (z. B. .container, .math, .info-box, .table-wrapper -->
  <link rel="stylesheet" href="https://juppijo.github.io/WRZT/WRZT4/Fiat_Lux/style.css">
  <!-- Internes CSS 	
  <link rel="stylesheet"
      href="C:\Users\juppi\Documents\GitHub\WRZT\WRZT4\Fiat_Lux\style.css">
	-->
</head>
<body>
  <!-- Interactive Controls Bar -->
  <div class="controls-bar">
    <button class="btn" onclick="toggleFullscreen()">⛶ Vollbild</button>
  </div>
  <div class="container">
    <h1>Willkommen</h1>

    <div style="border:1px solid #2a2a2a;border-radius:8px;padding:20px;max-width:340px;background:#141414;color:#e8e8e4;">
      <h3 style="margin:0 0 8px;color:#c9a227;">Titel der Karte</h3>
      <p style="margin:0 0 14px;font-size:14px;line-height:1.5;">Kurzer Beschreibungstext für diese Karte.</p>
      <button style="background:#c9a227;color:#161200;border:none;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer;">Mehr erfahren</button>
    </div>

    <p>Lade eine eigene HTML-Datei über „Laden" oder bearbeite diese Seite direkt im Editor.</p>
  </div>
  <!-- JavaScript for Fullscreen Mode -->
  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`Fehler beim Aktivieren des Vollbildmodus: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
