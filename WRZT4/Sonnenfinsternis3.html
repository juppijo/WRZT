<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonnenfinsternis Simulation – 12. August 2026</title>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.15);
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --panel-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Style-Variante: Türkis-Modern */
    body.theme-turquoise {
      --bg-glass: rgba(6, 44, 48, 0.88);
      --border-color: rgba(45, 212, 191, 0.3);
      --text-color: #f0fdf4;
      --accent-color: #2dd4bf;
      --accent-hover: #14b8a6;
      --panel-shadow: 0 20px 25px -5px rgba(0, 50, 50, 0.7);
    }

    /* Style-Variante: High Contrast / AMOLED */
    body.theme-highcontrast {
      --bg-glass: rgba(0, 0, 0, 0.95);
      --border-color: #ffffff;
      --text-color: #ffffff;
      --accent-color: #facc15;
      --accent-hover: #eab308;
      --panel-shadow: 0 0 0 2px #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: var(--text-color);
      transition: background-color 0.4s ease;
    }

    #canvasContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI Overlay */
    .ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 360px;
      max-width: calc(100vw - 40px);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--panel-shadow);
      transition: all 0.3s ease;
    }

    .ui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .ui-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .input-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-color);
    }

    select.input-field {
      cursor: pointer;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider {
      flex: 1;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .time-display {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      text-align: center;
      margin: 8px 0;
    }

    .playback-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-color);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .info-box {
      margin-top: 15px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid var(--border-color);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-val {
      font-weight: 600;
      color: var(--accent-color);
    }

    /* Responsive Tweaks */
    @media (max-width: 480px) {
      .ui-overlay {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        padding: 15px;
      }
    }
  </style>
</head>
<body class="theme-dark">

  <div id="canvasContainer">
    <canvas id="eclipseCanvas"></canvas>
  </div>

  <div class="ui-overlay">
    <div class="ui-header">
      <h1>Sonnenfinsternis 2026</h1>
      <div class="header-buttons">
        <button class="icon-btn" id="styleBtn" title="Design wechseln">🎨</button>
        <button class="icon-btn" id="fullscreenBtn" title="Vollbild">⛶</button>
      </div>
    </div>

    <!-- Ortseingabe -->
    <div class="control-group">
      <label>Schnellauswahl Ort</label>
      <select id="presetSelect" class="input-field">
        <option value="custom">-- Eigene Koordinaten --</option>
        <option value="50.68,6.01">Lontzen / Aachen (ca. 89% Bedeckung)</option>
        <option value="40.41,-3.70">Madrid, Spanien (100% Total)</option>
        <option value="39.57,2.73">Palma de Mallorca, Spanien (100% Total)</option>
        <option value="64.14,-21.94">Reykjavík, Island (100% Total)</option>
        <option value="52.52,13.40">Berlin, Deutschland (ca. 84% Bedeckung)</option>
      </select>
    </div>

    <div class="control-group">
      <label>Standort Koordinaten</label>
      <div class="coords-grid">
        <input type="number" id="latInput" class="input-field" placeholder="Breite (°N)" step="0.01" value="50.68">
        <input type="number" id="lonInput" class="input-field" placeholder="Länge (°E)" step="0.01" value="6.01">
      </div>
    </div>

    <!-- Zeitsteuerung -->
    <div class="control-group">
      <label>Zeitverlauf (12. Aug 2026, UTC)</label>
      <div class="time-display" id="timeDisplay">17:30:00 UTC</div>
      <div class="slider-container">
        <input type="range" id="timeSlider" class="slider" min="16.0" max="20.0" step="0.002" value="17.5">
      </div>
    </div>

    <div class="playback-controls">
      <button class="btn" id="playPauseBtn">▶ Play</button>
      <button class="btn" id="resetBtn">↺ Max Phase</button>
    </div>

    <!-- Live Daten -->
    <div class="info-box">
      <div class="info-row">
        <span>Bedeckungsgrad:</span>
        <span class="info-val" id="obscurationVal">0 %</span>
      </div>
      <div class="info-row">
        <span>Phase:</span>
        <span class="info-val" id="phaseVal">Partiell</span>
      </div>
      <div class="info-row">
        <span>Max. Bedeckung Ort:</span>
        <span class="info-val" id="maxObscurationVal">89 %</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('eclipseCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elemente
    const latInput = document.getElementById('latInput');
    const lonInput = document.getElementById('lonInput');
    const presetSelect = document.getElementById('presetSelect');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const styleBtn = document.getElementById('styleBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    const obscurationVal = document.getElementById('obscurationVal');
    const phaseVal = document.getElementById('phaseVal');
    const maxObscurationVal = document.getElementById('maxObscurationVal');

    // Animation & State
    let isPlaying = false;
    let animFrame = null;
    let themes = ['theme-dark', 'theme-turquoise', 'theme-highcontrast'];
    let currentThemeIdx = 0;

    // Sterne-Daten für Totalität
    const stars = [];
    for(let i = 0; i < 150; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.5 + 0.5,
        alpha: Math.random()
      });
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Astronomisches Rechenmodell für den 12. August 2026
    function calculateEclipseParams(lat, lon, timeHours) {
      // Pfad-Zentrum der Finsternis am 12.08.2026 (vereinfachte Kepler/Projektions-Approximation)
      // Der Kernschatten wandert von Island (ca. 17:30 UTC) über Spanien (ca. 18:30 UTC)
      
      // Zeitpunkt der maximalen Finsternis basierend auf der Länge
      const tMax = 17.5 + (lon - (-10)) * 0.035; 
      
      // Breitengrad des Kernschatten-Zentrums zu Zeit t
      const centralLat = 65 - (timeHours - 16.5) * 22.0;
      const centralLon = -25 + (timeHours - 16.5) * 16.0;

      // Distanzberechnung zwischen Standort und Kernschattenzentrum
      const dLat = lat - centralLat;
      const dLon = lon - centralLon;
      const distToCenter = Math.sqrt(dLat * dLat + (dLon * Math.cos(lat * Math.PI / 180)) ** 2);

      // Maximale Bedeckung für diesen Ort
      let maxObscuration = Math.max(0, 1 - (distToCenter / 12.0));
      if (distToCenter < 1.1) maxObscuration = 1.0; // Totalitätszone (~200km Breite)

      // Relativer Verlauf des Mondes vor der Sonne zur Zeit t
      const dt = (timeHours - tMax) * 2.2; // Zeitabstand vom Maximum
      
      // Relativer Versatz (Mond zieht von oben rechts nach unten links / West nach Ost)
      const dx = dt; 
      const minOffset = (1 - maxObscuration) * 1.05; 
      const dy = dt * 0.3 + minOffset;

      return {
        dx: dx,
        dy: dy,
        dist: Math.sqrt(dx*dx + dy*dy),
        maxObscuration: Math.min(1, maxObscuration),
        tMax: tMax
      };
    }

    function draw() {
      const lat = parseFloat(latInput.value) || 0;
      const lon = parseFloat(lonInput.value) || 0;
      const timeHours = parseFloat(timeSlider.value);

      // Zeit-Anzeige formatieren
      const h = Math.floor(timeHours);
      const m = Math.floor((timeHours - h) * 60);
      const s = Math.floor((((timeHours - h) * 60) - m) * 60);
      timeDisplay.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} UTC`;

      const params = calculateEclipseParams(lat, lon, timeHours);
      
      // Aktueller Überlappungsgrad (0 bis 1)
      const sunR = Math.min(canvas.width, canvas.height) * 0.18;
      const moonR = sunR * 1.015; // Mond ist scheinbar leicht größer als Sonne
      
      const distPixels = params.dist * sunR * 1.8;
      
      // Exakte Abdeckung in Prozent
      let obscuration = 0;
      if (distPixels < sunR + moonR) {
        if (distPixels <= Math.abs(sunR - moonR)) {
          obscuration = 1.0; // Total
        } else {
          // Kreis-Überlappungsformel
          const r1 = sunR, r2 = moonR, d = distPixels;
          const a = (r1*r1 - r2*r2 + d*d) / (2*d);
          const cbd = Math.max(-1, Math.min(1, a / r1));
          const cad = Math.max(-1, Math.min(1, (d - a) / r2));
          const area = r1*r1 * Math.acos(cbd) - a * Math.sqrt(r1*r1 - a*a) +
                       r2*r2 * Math.acos(cad) - (d - a) * Math.sqrt(r2*r2 - (d - a)*(d - a));
          obscuration = area / (Math.PI * sunR * sunR);
        }
      }
      obscuration = Math.max(0, Math.min(1, obscuration));

      // UI Texte aktualisieren
      obscurationVal.textContent = `${(obscuration * 100).toFixed(1)} %`;
      maxObscurationVal.textContent = `${(params.maxObscuration * 100).toFixed(1)} %`;
      if (obscuration >= 0.999) {
        phaseVal.textContent = "Totalität 🌘";
        phaseVal.style.color = "#f43f5e";
      } else if (obscuration > 0) {
        phaseVal.textContent = "Partiell";
        phaseVal.style.color = "var(--accent-color)";
      } else {
        phaseVal.textContent = "Keine";
        phaseVal.style.color = "var(--text-color)";
      }

      // --- HIMMELS-HINTERGRUND RENDERN ---
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Himmelsfarbe adaptieren je nach Bedeckung
      const skyFactor = Math.pow(1 - obscuration, 2.5);
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      
      const rSky = Math.round(12 * skyFactor + 5);
      const gSky = Math.round(120 * skyFactor + 8);
      const bSky = Math.round(230 * skyFactor + 20);
      
      skyGrad.addColorStop(0, `rgb(${rSky}, ${gSky}, ${bSky})`);
      skyGrad.addColorStop(1, `rgb(${Math.round(rSky*0.3)}, ${Math.round(gSky*0.3)}, ${Math.round(bSky*0.4)})`);
      
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sterne bei starker Abdunkelung zeichnen
      if (obscuration > 0.85) {
        const starAlpha = (obscuration - 0.85) / 0.15;
        ctx.save();
        stars.forEach(s => {
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * starAlpha})`;
          ctx.beginPath();
          ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      // --- KORONA (Nur bei hoher Bedeckung) ---
      if (obscuration > 0.90) {
        const coronaAlpha = Math.pow((obscuration - 0.90) / 0.10, 2);
        ctx.save();
        ctx.translate(centerX, centerY);

        const coronaGrad = ctx.createRadialGradient(0, 0, sunR * 0.98, 0, 0, sunR * 3.5);
        coronaGrad.addColorStop(0, `rgba(255, 255, 255, ${0.9 * coronaAlpha})`);
        coronaGrad.addColorStop(0.2, `rgba(200, 230, 255, ${0.4 * coronaAlpha})`);
        coronaGrad.addColorStop(0.6, `rgba(100, 180, 255, ${0.1 * coronaAlpha})`);
        coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = coronaGrad;
        ctx.beginPath();
        ctx.arc(0, 0, sunR * 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Feine Plasma-Strahlen
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * coronaAlpha})`;
        ctx.lineWidth = 1.5;
        for (let a = 0; a < Math.PI * 2; a += 0.05) {
          const rayLen = sunR * (1.3 + Math.sin(a * 7) * 0.3 + Math.cos(a * 13) * 0.2);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * sunR, Math.sin(a) * sunR);
          ctx.lineTo(Math.cos(a) * rayLen, Math.sin(a) * rayLen);
          ctx.stroke();
        }
        ctx.restore();
      }

      // --- SONNE RENDERN ---
      ctx.save();
      ctx.translate(centerX, centerY);

      // Sonnen-Sonnenglanz / Corona-Glow
      const sunGlow = ctx.createRadialGradient(0, 0, sunR * 0.8, 0, 0, sunR * 2.0);
      sunGlow.addColorStop(0, `rgba(255, 240, 200, ${1 - obscuration * 0.9})`);
      sunGlow.addColorStop(0.5, `rgba(255, 180, 50, ${(1 - obscuration) * 0.5})`);
      sunGlow.addColorStop(1, 'rgba(255, 100, 0, 0)');
      
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(0, 0, sunR * 2.0, 0, Math.PI * 2);
      ctx.fill();

      // Sonnenkörper
      const sunBody = ctx.createRadialGradient(0, 0, 0, 0, 0, sunR);
      sunBody.addColorStop(0, '#ffffff');
      sunBody.addColorStop(0.7, '#fff7ed');
      sunBody.addColorStop(1, '#fde047');

      ctx.fillStyle = sunBody;
      ctx.beginPath();
      ctx.arc(0, 0, sunR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // --- MOND RENDERN (SCHATTEN) ---
      const moonX = centerX + params.dx * sunR * 1.8;
      const moonY = centerY + params.dy * sunR * 1.8;

      ctx.save();
      ctx.translate(moonX, moonY);

      // Mondscheibe (Dunkel mit minimalem Erdschein bei Totalität)
      const moonGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, moonR);
      const earthshine = obscuration > 0.98 ? 0.08 : 0.01;
      moonGrad.addColorStop(0, `rgba(20, 25, 35, ${1 - earthshine})`);
      moonGrad.addColorStop(1, '#05070b');

      ctx.fillStyle = moonGrad;
      ctx.beginPath();
      ctx.arc(0, 0, moonR, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // --- DIAMANTRING-EFFEKT (Bei ~99% Abdeckung) ---
      if (obscuration > 0.985 && obscuration < 0.999) {
        ctx.save();
        // Position der schmalen Sichel
        const ringX = centerX + (moonX - centerX) * 0.96;
        const ringY = centerY + (moonY - centerY) * 0.96;

        const diamondGrad = ctx.createRadialGradient(ringX, ringY, 0, ringX, ringY, sunR * 0.6);
        diamondGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        diamondGrad.addColorStop(0.2, 'rgba(238, 242, 255, 0.9)');
        diamondGrad.addColorStop(0.5, 'rgba(199, 210, 254, 0.4)');
        diamondGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = diamondGrad;
        ctx.beginPath();
        ctx.arc(ringX, ringY, sunR * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Animation Loop
    function animate() {
      if (isPlaying) {
        let val = parseFloat(timeSlider.value) + 0.0015;
        if (val > parseFloat(timeSlider.max)) {
          val = parseFloat(timeSlider.min);
        }
        timeSlider.value = val;
        draw();
        animFrame = requestAnimationFrame(animate);
      }
    }

    // Event Handlers
    timeSlider.addEventListener('input', draw);
    latInput.addEventListener('input', () => { presetSelect.value = 'custom'; draw(); });
    lonInput.addEventListener('input', () => { presetSelect.value = 'custom'; draw(); });

    presetSelect.addEventListener('change', (e) => {
      if (e.target.value !== 'custom') {
        const [lat, lon] = e.target.value.split(',').map(Number);
        latInput.value = lat;
        lonInput.value = lon;
        
        // Zeit auf Finsternis-Maximum des Ortes setzen
        const params = calculateEclipseParams(lat, lon, 17.5);
        timeSlider.value = params.tMax;
        draw();
      }
    });

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      if (isPlaying) animate();
    });

    resetBtn.addEventListener('click', () => {
      const lat = parseFloat(latInput.value) || 0;
      const lon = parseFloat(lonInput.value) || 0;
      const params = calculateEclipseParams(lat, lon, 17.5);
      timeSlider.value = params.tMax;
      draw();
    });

    // Theme Switcher
    styleBtn.addEventListener('click', () => {
      document.body.classList.remove(themes[currentThemeIdx]);
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      document.body.classList.add(themes[currentThemeIdx]);
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Initiales Zeichnen
    draw();
  </script>
</body>
</html>
