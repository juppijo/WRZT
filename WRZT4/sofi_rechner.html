<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonnenfinsternis 2026 – Exakter Bedeckungsrechner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .calculator {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h2 {
      margin-top: 0;
      color: var(--accent);
      font-size: 1.5rem;
      text-align: center;
    }

    p.sub {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #d97706;
    }

    .result-box {
      margin-top: 24px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .result-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0;
    }

    .result-detail {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="calculator">
  <h2>SoFi 2026 Rechner</h2>
  <p class="sub">Korrigierte Berechnung f&uuml;r den 12. August 2026</p>

  <div class="form-group">
    <label for="preset">Schnellauswahl Ort:</label>
    <select id="preset" onchange="applyPreset()">
      <option value="custom">-- Manuell eingeben --</option>
      <option value="50.775,6.083">Aachen (~86%)</option>
      <option value="50.850,4.351">Brüssel (~85%)</option>
      <option value="48.856,2.352">Paris (~92%)</option>
      <option value="41.648,-0.889">Saragossa (100% Totalität)</option>
      <option value="39.569,2.650">Palma de Mallorca (100% Totalität)</option>
      <option value="64.146,-21.942">Reykjavík (~98%)</option>
      <option value="52.520,13.405">Berlin (~74%)</option>
    </select>
  </div>

  <div class="row">
    <div class="form-group">
      <label for="lat">Breite (&deg;N):</label>
      <input type="text" id="lat" value="50.775" placeholder="z.B. 50.775">
    </div>
    <div class="form-group">
      <label for="lon">L&auml;nge (&deg;O/W):</label>
      <input type="text" id="lon" value="6.083" placeholder="z.B. 6.083">
    </div>
  </div>

  <button type="button" onclick="calculateEclipse()">Bedeckung Berechnen</button>

  <div class="result-box">
    <div class="result-detail">Maximale Fl&auml;chenbedeckung</div>
    <div class="result-value" id="obscuration">-- %</div>
    <div class="result-detail" id="magnitude">Magnitude: --</div>
    <div class="result-detail" id="distance">Abstand zur Zentrallinie: -- km</div>
  </div>
</div>

<script>
  function parseCoordinate(input) {
    if (!input) return NaN;
    let clean = input.toString().replace(',', '.').replace(/[°\s]/g, '');
    return parseFloat(clean);
  }

  function applyPreset() {
    const select = document.getElementById('preset');
    if (select.value === 'custom') return;
    const [lat, lon] = select.value.split(',');
    document.getElementById('lat').value = lat;
    document.getElementById('lon').value = lon;
    calculateEclipse();
  }

  // Haversine-Formel zur Distanzberechnung zweier Punkte auf der Erde in km
  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371; // Erdradius in km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // Berechnet den minimalen Abstand eines Punktes zu den Pfadsegmenten der Zentrallinie
  function getDistanceToCenterline(lat, lon) {
    // Stützpunkte der Zentrallinie am 12. August 2026 (Island -> NW-Spanien -> Saragossa -> Mallorca)
    const path = [
      {lat: 65.20, lon: -25.20},
      {lat: 43.50, lon: -8.00},
      {lat: 41.65, lon: -0.89},
      {lat: 39.57, lon: 2.65}
    ];

    let minDistance = Infinity;

    // Abstand zu allen Segmenten prüfen
    for (let i = 0; i < path.length - 1; i++) {
      const p1 = path[i];
      const p2 = path[i+1];

      // Interpolation entlang des Segments für genauen Abstand
      const steps = 50;
      for (let t = 0; t <= steps; t++) {
        const interLat = p1.lat + (p2.lat - p1.lat) * (t / steps);
        const interLon = p1.lon + (p2.lon - p1.lon) * (t / steps);
        const dist = getDistanceKm(lat, lon, interLat, interLon);
        if (dist < minDistance) {
          minDistance = dist;
        }
      }
    }

    return minDistance;
  }

  function calculateEclipse() {
    const lat = parseCoordinate(document.getElementById('lat').value);
    const lon = parseCoordinate(document.getElementById('lon').value);

    if (isNaN(lat) || isNaN(lon)) {
      alert("Bitte gültige Koordinaten eingeben.");
      return;
    }

    // 1. Abstand zur Zentrallinie in Kilometern
    const distKm = getDistanceToCenterline(lat, lon);

    // Physikalische Parameter der Finsternis am 12.08.2026
    const totalRadiusKm = 145;   // Halbe Breite der Totalitätszone (~290 km)
    const penumbraRadiusKm = 2400; // Radius des Halbschattens in Europa

    let magnitude = 0;
    let obscuration = 0;

    if (distKm <= totalRadiusKm) {
      // Innerhalb der Totalitätszone
      magnitude = 1.0;
      obscuration = 100.0;
    } else if (distKm >= penumbraRadiusKm) {
      // Außerhalb des Schattens
      magnitude = 0;
      obscuration = 0;
    } else {
      // Im Halbschattenbereich
      magnitude = 1.0 - ((distKm - totalRadiusKm) / (penumbraRadiusKm - totalRadiusKm));
      magnitude = Math.max(0, Math.min(1, magnitude));

      // Umrechnung von Magnitude (m) in Flächenbedeckung (Obscuration A)
      // Exakte geometrische Approximation der Schnittfläche zweier Kreise
      const m = magnitude;
      if (m <= 0) {
        obscuration = 0;
      } else if (m >= 1) {
        obscuration = 100;
      } else {
        // Flächenformel basierend auf Überlappungsgrad
        const x = (m - 0.5) * 2; // Skalierung [-1, 1]
        // Geometrische Kurve der Flächenüberlappung
        const areaRatio = (Math.acos(-x) - x * Math.sqrt(1 - x * x)) / Math.PI;
        obscuration = Math.max(0, Math.min(100, areaRatio * 100));
      }
    }

    // Ergebnisse im UI aktualisieren
    document.getElementById('obscuration').innerText = obscuration.toFixed(1) + " %";
    document.getElementById('magnitude').innerText = "Magnitude (Durchmesser): " + (magnitude * 100).toFixed(1) + " %";
    document.getElementById('distance').innerText = "Abstand zur Zentrallinie: ~" + Math.round(distKm) + " km";
  }

  // Erstberechnung beim Laden
  window.onload = calculateEclipse;
</script>

</body>
</html>
