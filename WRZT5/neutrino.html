<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRZT – Neutrino Helikal-Torsions-Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0f2fe;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #0284c7;
            border-radius: 8px;
            padding: 16px 20px;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0, 186, 211, 0.2);
            backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #38bdf8;
            border-bottom: 1px solid #0369a1;
            padding-bottom: 6px;
        }
        p {
            font-size: 0.85rem;
            line-height: 1.4;
            margin: 6px 0;
            color: #bae6fd;
        }
        .flavour-tag {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        .stat {
            font-weight: bold;
            color: #00f2fe;
        }
        #controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }
        input[type=range] {
            accent-color: #00f2fe;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>WRZT: Neutrino Helikal-Welle</h1>
        <p>Ein magerer Torsions-Impuls im Ur-Druckfeld $P_{\text{Ur}}$:</p>
        <p>• Aktueller Flavour: <span id="flavour-display" class="flavour-tag">Elektron-Neutrino (&nu;<sub>e</sub>)</span></p>
        <p>• Chiralität: <span class="stat">Strikt Linkshändig</span></p>
        <p>• Phasen-Oszillation: <span id="val-phase" class="stat">0.0</span> rad</p>
        <p><i>Geringer Querschnitt $\rightarrow$ Hohe Durchdringung im Raumzeit-Medium.</i></p>

        <div id="controls">
            <label>Fluggeschwindigkeit: <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1.2"></label>
            <label>Schrauben-Amplitude ($r$): <input type="range" id="ampSlider" min="0.1" max="1.0" step="0.05" value="0.35"></label>
            <label>Oszillations-Frequenz: <input type="range" id="freqSlider" min="0.1" max="2" step="0.1" value="0.8"></label>
        </div>
    </div>

    <script>
        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0f14, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x0b0f14);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. Beleuchtung ---
        const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00f2fe, 2, 40);
        scene.add(pointLight);

        // --- 3. Hintergrund-Gitter (Ur-Druckfeld-Medium) ---
        const gridHelper = new THREE.GridHelper(30, 40, 0x0284c7, 0x0f172a);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // --- 4. Neutrino Helikal-Geometrie (Schrauben-Torus) ---
        let helixRadius = 0.35; // Sehr dünner Querschnitt
        const helixLength = 16.0;
        const turns = 6;
        const pathPoints = 300;

        let helixMesh, corePulseMesh;
        let particleSystem;

        function createHelixGeometry(radius) {
            const points = [];
            for (let i = 0; i <= pathPoints; i++) {
                const t = i / pathPoints;
                const x = (t - 0.5) * helixLength;
                const angle = t * turns * Math.PI * 2;
                const y = radius * Math.cos(angle);
                const z = radius * Math.sin(angle);
                points.push(new THREE.Vector3(x, y, z));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            return new THREE.TubeGeometry(curve, 200, 0.06, 12, false);
        }

        const helixMaterial = new THREE.MeshPhongMaterial({
            color: 0x38bdf8,
            emissive: 0x0284c7,
            transparent: true,
            opacity: 0.85,
            wireframe: false
        });

        helixMesh = new THREE.Mesh(createHelixGeometry(helixRadius), helixMaterial);
        scene.add(helixMesh);

        // Pulsierende Phasen-Spitze (Front-Kopf)
        const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
        const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const headMesh = new THREE.Mesh(headGeo, headMat);
        scene.add(headMesh);

        // Partikel-Trail (Ur-Feld-Spur)
        const pCount = 80;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for(let i=0; i<pCount*3; i++) { pPos[i] = (Math.random() - 0.5) * 10; }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        
        const pMat = new THREE.PointsMaterial({
            color: 0x38bdf8,
            size: 0.08,
            transparent: true,
            opacity: 0.5
        });
        particleSystem = new THREE.Points(pGeo, pMat);
        scene.add(particleSystem);

        // --- 5. Animation & Oszillation ---
        let animTime = 0;
        const speedInput = document.getElementById('speedSlider');
        const ampInput = document.getElementById('ampSlider');
        const freqInput = document.getElementById('freqSlider');
        const flavourDisplay = document.getElementById('flavour-display');
        const valPhase = document.getElementById('val-phase');

        ampInput.addEventListener('input', (e) => {
            helixRadius = parseFloat(e.target.value);
            helixMesh.geometry.dispose();
            helixMesh.geometry = createHelixGeometry(helixRadius);
        });

        function animate() {
            requestAnimationFrame(animate);

            const speed = parseFloat(speedInput.value) * 0.05;
            const oscFreq = parseFloat(freqInput.value) * 0.5;
            
            animTime += speed;

            // 1. Schrauben-Rotation (Linkshändige Torsion entlang X-Achse)
            helixMesh.rotation.x = animTime * 2;
            
            // 2. Bewegung & Oszillation des Farb-Flavours (nu_e -> nu_mu -> nu_tau)
            const oscPhase = (animTime * oscFreq) % (Math.PI * 2);
            valPhase.innerText = oscPhase.toFixed(2);

            // Dynamischer Farbwechsel für Oszillation
            // nu_e (Cyan/Blau), nu_mu (Magenta/Violett), nu_tau (Smaragd/Grün)
            let rColor, gColor, bColor, flavourText, bgColor, borderCol;

            if (oscPhase < (Math.PI * 2 / 3)) {
                // Elektron-Neutrino (Cyan-Blau)
                rColor = 0.0; gColor = 0.8; bColor = 1.0;
                flavourText = "Elektron-Neutrino (νₑ)";
                bgColor = "rgba(6, 182, 212, 0.3)";
                borderCol = "#06b6d4";
            } else if (oscPhase < (Math.PI * 4 / 3)) {
                // Myon-Neutrino (Violett/Magenta)
                rColor = 0.8; gColor = 0.2; bColor = 1.0;
                flavourText = "Myon-Neutrino (ν_μ)";
                bgColor = "rgba(168, 85, 247, 0.3)";
                borderCol = "#a855f7";
            } else {
                // Tau-Neutrino (Smaragd-Grün)
                rColor = 0.1; gColor = 0.9; bColor = 0.5;
                flavourText = "Tau-Neutrino (ν_τ)";
                bgColor = "rgba(34, 197, 94, 0.3)";
                borderCol = "#22c55e";
            }

            helixMaterial.color.setRGB(rColor, gColor, bColor);
            helixMaterial.emissive.setRGB(rColor * 0.5, gColor * 0.5, bColor * 0.5);
            pointLight.color.setRGB(rColor, gColor, bColor);

            flavourDisplay.innerText = flavourText;
            flavourDisplay.style.backgroundColor = bgColor;
            flavourDisplay.style.border = "1px solid " + borderCol;

            // Position des Front-Lichtkopfs
            const headX = (helixLength / 2);
            const headAngle = (turns * Math.PI * 2) + (helixMesh.rotation.x);
            headMesh.position.set(headX, helixRadius * Math.cos(headAngle), helixRadius * Math.sin(headAngle));
            pointLight.position.copy(headMesh.position);

            // Partikel leicht durchs Bild wandern lassen
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i = 0; i < pCount; i++) {
                positions[i*3] -= speed * 0.5;
                if(positions[i*3] < -helixLength/2) positions[i*3] = helixLength/2;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
