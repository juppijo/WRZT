<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datei-Inhaltssuche mit Vorschau</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --success-color: #2ec4b6;
            --code-bg: #f8f9fa;
        }

        body.dark-mode {
            --bg-color: #1e1e2e;
            --card-bg: #2b2b3d;
            --text-color: #e0e0e0;
            --border-color: #3f3f5a;
            --primary-color: #6c5ce7;
            --primary-hover: #5b4bc4;
            --success-color: #00b894;
            --code-bg: #181825;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .top-controls {
            display: flex;
            gap: 0.5rem;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 600px) {
            .form-group { grid-template-columns: 1fr; }
        }

        label { font-weight: 600; align-self: center; }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover { background-color: var(--border-color); }

        .btn-small {
            padding: 0.35rem 0.6rem;
            font-size: 0.8rem;
        }

        .actions { margin-top: 1.5rem; }

        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-style: italic;
            color: var(--primary-color);
        }

        .results-container { margin-top: 2rem; }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .results-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .result-item {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .result-info {
            flex: 1;
            min-width: 250px;
            word-break: break-all;
        }

        .filename {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--primary-color);
            margin-bottom: 0.25rem;
        }

        .filepath {
            font-family: monospace;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .button-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .copied { background-color: var(--success-color) !important; }

        /* Modal Vorschau Fensters */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 1.5rem;
            border-radius: 12px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-body {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 6px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔍 Datei-Inhaltssuche</h1>
        <div class="top-controls">
            <button class="btn btn-secondary" id="themeBtn">🌙 Theme</button>
            <button class="btn btn-secondary" id="fullscreenBtn">⛶ Vollbild</button>
        </div>
    </div>

    <div class="form-group">
        <label for="searchTerm">Suchbegriff / Text:</label>
        <input type="text" id="searchTerm" placeholder="Suchbegriff eingeben...">
    </div>

    <div class="form-group">
        <label for="fileExtensions">Endungen (leer = alle Textdateien):</label>
        <input type="text" id="fileExtensions" placeholder="z. B. txt, html, js, md, css">
    </div>

    <div class="actions">
        <button class="btn" id="startBtn">📁 Ordner wählen & Suchen</button>
    </div>

    <div class="status" id="statusText"></div>

    <div class="results-container">
        <div class="results-header">
            <h2>Ergebnisse (<span id="count">0</span>)</h2>
            <button class="btn btn-secondary btn-small" id="copyAllBtn" style="display: none;">📋 Alle als Liste kopieren</button>
        </div>
        <ul class="results-list" id="resultsList"></ul>
    </div>
</div>

<!-- Modal für Datei-Vorschau -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Datei-Vorschau</h3>
            <button class="btn btn-secondary btn-small" id="closeModalBtn">✖ Schließen</button>
        </div>
        <pre class="modal-body" id="modalBody"></pre>
    </div>
</div>

<script>
    const themeBtn = document.getElementById('themeBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const startBtn = document.getElementById('startBtn');
    const searchTermInput = document.getElementById('searchTerm');
    const fileExtInput = document.getElementById('fileExtensions');
    const statusText = document.getElementById('statusText');
    const resultsList = document.getElementById('resultsList');
    const countSpan = document.getElementById('count');
    const copyAllBtn = document.getElementById('copyAllBtn');

    const previewModal = document.getElementById('previewModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    let foundFiles = [];

    themeBtn.addEventListener('click', () => document.body.classList.toggle('dark-mode'));

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    });

    closeModalBtn.addEventListener('click', () => previewModal.style.display = 'none');
    previewModal.addEventListener('click', (e) => {
        if (e.target === previewModal) previewModal.style.display = 'none';
    });

    startBtn.addEventListener('click', async () => {
        const searchTerm = searchTermInput.value.trim();
        if (!searchTerm) {
            alert('Bitte gib einen Suchbegriff ein.');
            return;
        }

        const extensions = fileExtInput.value
            .split(',')
            .map(ext => ext.trim().toLowerCase().replace('.', ''))
            .filter(ext => ext.length > 0);

        try {
            const dirHandle = await window.showDirectoryPicker();
            
            resultsList.innerHTML = '';
            foundFiles = [];
            countSpan.textContent = '0';
            copyAllBtn.style.display = 'none';
            statusText.textContent = 'Durchsuche Verzeichnisse...';

            let checkedCount = 0;
            let matchCount = 0;

            async function scanDirectory(handle, currentPath) {
                for await (const entry of handle.values()) {
                    const relativePath = `${currentPath}/${entry.name}`;

                    if (entry.kind === 'directory') {
                        await scanDirectory(entry, relativePath);
                    } else if (entry.kind === 'file') {
                        const ext = entry.name.split('.').pop().toLowerCase();
                        if (extensions.length > 0 && !extensions.includes(ext)) continue;

                        checkedCount++;
                        statusText.textContent = `Geprüfte Dateien: ${checkedCount} | Aktuell: ${relativePath}`;

                        try {
                            const file = await entry.getFile();
                            if (file.size < 20 * 1024 * 1024) { // Max 20MB
                                const text = await file.text();
                                if (text.includes(searchTerm)) {
                                    matchCount++;
                                    const fileData = {
                                        name: entry.name,
                                        path: relativePath,
                                        fileObj: file
                                    };
                                    foundFiles.push(fileData);
                                    addResultToUI(fileData);
                                    countSpan.textContent = matchCount;
                                }
                            }
                        } catch (e) {}
                    }
                }
            }

            await scanDirectory(dirHandle, dirHandle.name);
            statusText.textContent = `Suche abgeschlossen! ${checkedCount} Dateien durchsucht.`;
            if (foundFiles.length > 0) copyAllBtn.style.display = 'inline-flex';

        } catch (err) {
            if (err.name !== 'AbortError') {
                alert('Fehler beim Zugriff: ' + err.message);
            }
            statusText.textContent = 'Abgebrochen oder fehlgeschlagen.';
        }
    });

    function addResultToUI(fileData) {
        const li = document.createElement('li');
        li.className = 'result-item';

        const infoDiv = document.createElement('div');
        infoDiv.className = 'result-info';
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'filename';
        nameDiv.textContent = fileData.name;

        const pathDiv = document.createElement('div');
        pathDiv.className = 'filepath';
        pathDiv.textContent = fileData.path;

        infoDiv.appendChild(nameDiv);
        infoDiv.appendChild(pathDiv);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'button-group';

        // 1. Pfad Kopieren
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn btn-secondary btn-small';
        copyBtn.innerHTML = '📋 Pfad';
        copyBtn.title = 'Name und Pfad kopieren';
        copyBtn.addEventListener('click', () => {
            copyToClipboard(`${fileData.name} | ${fileData.path}`, copyBtn);
        });

        // 2. Datei im Browser-Modal ÖFFNEN / ANZEIGEN
        const openBtn = document.createElement('button');
        openBtn.className = 'btn btn-small';
        openBtn.innerHTML = '👁 Vorschau';
        openBtn.title = 'Datei-Inhalt direkt anzeigen';
        openBtn.addEventListener('click', async () => {
            const text = await fileData.fileObj.text();
            modalTitle.textContent = fileData.name;
            modalBody.textContent = text;
            previewModal.style.display = 'flex';
        });

        // 3. Datei HERUNTERLADEN / EXPORTIEREN
        const downloadBtn = document.createElement('button');
        downloadBtn.className = 'btn btn-secondary btn-small';
        downloadBtn.innerHTML = '💾 ÖFFNEN / SPEICHERN';
        downloadBtn.title = 'Datei lokal zum Öffnen ausgeben';
        downloadBtn.addEventListener('click', () => {
            const url = URL.createObjectURL(fileData.fileObj);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileData.name;
            a.click();
            URL.revokeObjectURL(url);
        });

        btnGroup.appendChild(openBtn);
        btnGroup.appendChild(downloadBtn);
        btnGroup.appendChild(copyBtn);

        li.appendChild(infoDiv);
        li.appendChild(btnGroup);
        resultsList.appendChild(li);
    }

    function copyToClipboard(text, buttonElement) {
        navigator.clipboard.writeText(text).then(() => {
            const originalText = buttonElement.innerHTML;
            buttonElement.innerHTML = '✓ Kopiert!';
            buttonElement.classList.add('copied');
            setTimeout(() => {
                buttonElement.innerHTML = originalText;
                buttonElement.classList.remove('copied');
            }, 1500);
        });
    }

    copyAllBtn.addEventListener('click', () => {
        const allText = foundFiles.map(f => `${f.name}\t${f.path}`).join('\n');
        copyToClipboard(allText, copyAllBtn);
    });
</script>

</body>
</html>
