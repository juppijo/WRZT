<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxie 3D mit schwarzem Loch</title>
<style>
:root{color-scheme:dark;--bg:#02030a;--glass:rgba(14,18,38,.72);--line:rgba(160,180,255,.22);--tx:#e6ebff;--mut:#8f9bd0;--ac:#ffb454;--ac2:#6fa8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{background:rgba(255,255,255,.15)}
#fs{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;backdrop-filter:blur(8px);background:var(--glass)}
#panel{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(330px,calc(100vw - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:5}
#panel header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;font-weight:600;letter-spacing:.04em}
#panel header span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#body{padding:0 16px 14px;overflow-y:auto}
#panel.closed #body{display:none}
.row{margin:9px 0}
.row label{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px}
.row label b{color:var(--tx);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 0}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button{flex:1}
small{display:block;margin-top:10px;color:var(--mut);font-size:11.5px}
#phase{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:7px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:12.5px;color:var(--ac);max-width:calc(100vw - 24px);transition:opacity .6s;pointer-events:none}
#phase:empty{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fs">⛶ Vollbild</button>
<div id="phase"></div>
<div id="panel">
  <header><span>✦ Galaxie-Labor 3D</span><button id="tg" title="Einklappen">–</button></header>
  <div id="body">
    <div id="ctl"></div>
    <div class="btns"><button id="form">✦ Entstehung: an</button><button id="auto">⟳ Auto-Drehung: an</button><button id="pause">⏸ Pause</button><button id="reset">↻ Neu</button></div>
    <small>Ziehen: Kamera drehen · Mausrad / Pinch: Zoom · Leertaste: Pause · F: Vollbild. Sterne, Arme, Rotation und Scheibendicke wirken beim Neustart.</small>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,paused=false,zoom=1,yaw=.6,pitch=.55,auto=true;
const P={grav:3,out:1,fric:0,bh:14,speed:1,trail:.7,n:9000,arms:2,spin:1,thick:40};
const defs=[
 ['grav','Schwerkraft (schwarzes Loch)',0,10,.1],
 ['out','Fliehkraft nach außen',0,10,.1],
 ['fric','Reibung',0,.5,.01],
 ['bh','Größe des schwarzen Lochs',4,40,1],
 ['speed','Zeitgeschwindigkeit',.1,4,.1],
 ['trail','Leuchtspur',0,.95,.01],
 ['n','Anzahl Sterne',500,25000,500,1],
 ['arms','Spiralarme',1,6,1,1],
 ['spin','Anfangsrotation',0,1.5,.01,1],
 ['thick','Dicke der Scheibe',0,150,5,1]
];
const ctl=document.getElementById('ctl');
defs.forEach(([k,l,mn,mx,st,re])=>{
  const d=document.createElement('div');d.className='row';
  d.innerHTML=`<label>${l}<b>${P[k]}</b></label><input type="range" min="${mn}" max="${mx}" step="${st}" value="${P[k]}">`;
  const inp=d.querySelector('input'),out=d.querySelector('b');
  inp.oninput=()=>{P[k]=+inp.value;out.textContent=P[k];if(re)init()};
  ctl.appendChild(d);
});
const NB=8,cols=[];
for(let i=0;i<NB;i++){const t=i/(NB-1);cols.push(`hsl(${Math.round(35+t*185)},${90-t*10}%,${72-t*10}%)`)}
let x,y,z,vx,vy,vz,bin,N=0,R=400,age=0,formOn=true,bhNow=14;
const gauss=()=>Math.random()+Math.random()+Math.random()-1.5;
function edge(){return P.out>0.001?Math.min(620,Math.cbrt(P.grav*2e7/P.out)):620}
function spawn(i,outer){
  R=Math.max(edge()*.95,P.bh*4);
  const rmin=P.bh*2.4,u=Math.random();
  let px,py,pz,r,tx,ty,tz;
  if(!outer&&Math.random()<.14){ // Zentralbulge (kugelförmig)
    r=rmin+Math.pow(u,2)*R*.3;
    const c=2*Math.random()-1,s=Math.sqrt(1-c*c),a=Math.random()*6.2832;
    const ux=s*Math.cos(a),uy=c,uz=s*Math.sin(a);
    px=ux*r;py=uy*r;pz=uz*r;
    const wx=gauss(),wy=gauss(),wz=gauss();
    tx=uy*wz-uz*wy;ty=uz*wx-ux*wz;tz=ux*wy-uy*wx;
    const l=Math.hypot(tx,ty,tz)||1;tx/=l;ty/=l;tz/=l;
  }else{
    r=outer?R*(.55+.45*u):rmin+(R-rmin)*Math.pow(u,1.6);
    const arm=Math.floor(Math.random()*P.arms),
          th=arm*2*Math.PI/P.arms+r*.011+(Math.random()+Math.random()-1)*(.25+r/R*.35);
    px=Math.cos(th)*r;pz=Math.sin(th)*r;py=gauss()*P.thick*(.3+.7*(1-r/R))*1.4;
    tx=-Math.sin(th);ty=0;tz=Math.cos(th);
  }
  const r3=Math.hypot(px,py,pz)+1e-6,ag=P.grav*1e6/(r3*r3+400),ao=P.out*.05*r3;
  const vc=Math.sqrt(Math.max(0,(ag-ao)*r3))*P.spin*(1+(Math.random()-.5)*.08);
  x[i]=px;y[i]=py;z[i]=pz;vx[i]=tx*vc;vy[i]=ty*vc+gauss()*vc*.04;vz[i]=tz*vc;
  bin[i]=Math.min(NB-1,Math.floor(Math.pow(r3/R,.8)*NB+Math.random()*1.3));
}
// WRZT-Entstehung: diffuse, leicht rotierende Wellenenergie-Wolke mit schwacher Armmodulation
function spawnCloud(i){
  R=Math.max(edge()*.95,P.bh*4);
  let px,py,pz,r,ph;
  do{
    r=R*1.05*Math.cbrt(Math.random());
    const c=2*Math.random()-1,a=Math.random()*6.2832,s=Math.sqrt(1-c*c);
    px=s*Math.cos(a)*r;py=c*r*.8;pz=s*Math.sin(a)*r;ph=Math.atan2(pz,px);
  }while(Math.random()>(1+.5*Math.cos(P.arms*ph))/1.5);
  const r3=Math.hypot(px,py,pz)+1e-6,rho=Math.hypot(px,pz)+1e-6;
  const ag=P.grav*1e6/(r3*r3+400),ao=P.out*.05*r3;
  const vt=Math.sqrt(Math.max(0,(ag-ao)*r3))*P.spin*.55*(1+(Math.random()-.5)*.3);
  x[i]=px;y[i]=py;z[i]=pz;vx[i]=-pz/rho*vt;vy[i]=0;vz[i]=px/rho*vt;
  bin[i]=Math.min(NB-1,Math.floor(Math.pow(r3/R,.8)*NB+Math.random()*1.3));
}
function init(){
  N=P.n;x=new Float32Array(N);y=new Float32Array(N);z=new Float32Array(N);
  vx=new Float32Array(N);vy=new Float32Array(N);vz=new Float32Array(N);bin=new Uint8Array(N);
  age=formOn?0:99;bhNow=P.bh*(formOn?.2:1);
  for(let i=0;i<N;i++)formOn?spawnCloud(i):spawn(i,false);
  ctx.fillStyle='#02030a';ctx.fillRect(0,0,cv.width,cv.height);
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.fillStyle='#02030a';ctx.fillRect(0,0,cv.width,cv.height);
}
addEventListener('resize',resize);
function step(dt){
  age+=dt;
  bhNow=P.bh*(formOn?.2+.8*Math.min(1,age/16):1);
  const gs=formOn?Math.min(1,.15+age/6):1,fm=formOn?Math.max(0,1-age/14):0;
  const G=P.grav*1e6*gs,O=P.out*.05,f=1-P.fric*dt,bh2=bhNow*bhNow,dy=1-fm*2.2*(1-P.thick/180)*dt;
  for(let i=0;i<N;i++){
    const px=x[i],py=y[i],pz=z[i],r2=px*px+py*py+pz*pz,r=Math.sqrt(r2)+1e-6;
    if(r2<bh2||r>1500){fm>0?spawnCloud(i):spawn(i,true);continue}
    const a=(O*r-G/(r2+400))/r*dt;
    vx[i]=(vx[i]+px*a)*f;vy[i]=(vy[i]+py*a)*f*dy;vz[i]=(vz[i]+pz*a)*f;
    x[i]=px+vx[i]*dt;y[i]=py+vy[i]*dt;z[i]=pz+vz[i]*dt;
  }
}
const D=1500;
function draw(){
  const cx=cv.width/2,cy=cv.height/2,focal=Math.min(W,H)*1.15*zoom*dpr;
  const ca=Math.cos(yaw),sa=Math.sin(yaw),cb=Math.cos(pitch),sb=Math.sin(pitch);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=`rgba(2,3,10,${1-P.trail})`;ctx.fillRect(0,0,cv.width,cv.height);
  const sx=new Float32Array(N),sy=new Float32Array(N),ss=new Float32Array(N);
  const base=Math.max(1.1,1.3*dpr);
  for(let i=0;i<N;i++){
    const X=x[i]*ca-z[i]*sa,Z1=x[i]*sa+z[i]*ca;
    const Y=y[i]*cb-Z1*sb,Z=y[i]*sb+Z1*cb,dep=D+Z;
    if(dep<80){ss[i]=0;continue}
    const f=focal/dep;sx[i]=cx+X*f;sy[i]=cy-Y*f;ss[i]=base*Math.min(2.6,Math.max(.5,f/(focal/D)));
  }
  ctx.globalCompositeOperation='lighter';
  for(let b=0;b<NB;b++){
    ctx.fillStyle=cols[b];
    for(let i=0;i<N;i++)if(bin[i]===b&&ss[i]>0)ctx.fillRect(sx[i],sy[i],ss[i],ss[i]);
  }
  // Schwarzes Loch + Akkretionsscheibe
  ctx.globalCompositeOperation='source-over';
  const f0=focal/D,br=bhNow*f0;
  const g=ctx.createRadialGradient(cx,cy,br*.9,cx,cy,br*4.5);
  g.addColorStop(0,'rgba(255,170,60,.7)');g.addColorStop(.25,'rgba(255,110,30,.28)');g.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,br*4.5,0,7);ctx.fill();
  const ry=Math.max(.04,Math.abs(sb));
  ctx.lineWidth=Math.max(1.5,br*.12);
  for(const [k,col] of [[1.6,'rgba(255,200,120,.85)'],[2.4,'rgba(255,130,50,.45)']]){
    ctx.strokeStyle=col;ctx.beginPath();ctx.ellipse(cx,cy,br*k,br*k*ry,0,0,7);ctx.stroke();
  }
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,br,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,215,150,.9)';ctx.lineWidth=Math.max(1.2,br*.06);
  ctx.beginPath();ctx.arc(cx,cy,br*1.03,0,7);ctx.stroke();
}
let lastPh='';
function phaseUpdate(){
  const t=!formOn?'':age<4?'① Verdichtung – Wellenenergie sammelt sich im Netz um den Kern':age<10?'② Kollaps & Rotation – der Drehimpuls flacht die Wolke zur Scheibe ab':age<18?'③ Spiralarme formen sich – das schwarze Loch wächst':age<24?'④ Die Galaxie reift':'';
  if(t!==lastPh){lastPh=t;document.getElementById('phase').textContent=t}
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  if(!paused){const d=dt*P.speed/2;step(d);step(d)}
  phaseUpdate();
  if(auto&&!drag)yaw+=dt*.12;
  draw();requestAnimationFrame(loop);
}
// Bedienung
const panel=document.getElementById('panel'),tg=document.getElementById('tg'),pb=document.getElementById('pause'),ab=document.getElementById('auto');
tg.onclick=()=>{panel.classList.toggle('closed');tg.textContent=panel.classList.contains('closed')?'+':'–'};
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
document.getElementById('fs').onclick=fs;
function pz(){paused=!paused;pb.textContent=paused?'▶ Weiter':'⏸ Pause'}
pb.onclick=pz;
ab.onclick=()=>{auto=!auto;ab.textContent='⟳ Auto-Drehung: '+(auto?'an':'aus')};
document.getElementById('reset').onclick=init;
const fb=document.getElementById('form');
fb.onclick=()=>{formOn=!formOn;fb.textContent='✦ Entstehung: '+(formOn?'an':'aus');init()};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pz()}else if(e.key==='f'||e.key==='F')fs()});
const clampZ=v=>Math.max(.3,Math.min(5,v));
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=clampZ(zoom*(e.deltaY<0?1.1:.9))},{passive:false});
const ptr=new Map();let drag=false,pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);drag=true;cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  const o=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===1){yaw+=(e.clientX-o[0])*.006;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-o[1])*.006))}
  else if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)zoom=clampZ(zoom*d/pd);pd=d}
});
const up=e=>{ptr.delete(e.pointerId);pd=0;if(!ptr.size){drag=false;cv.style.cursor='grab'}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
resize();init();requestAnimationFrame(loop);
</script>
</body>
</html>
