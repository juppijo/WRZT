<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WRZNT - Interferierende Wirbel-Wellen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #ui { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,10,40,0.9); padding: 20px; 
            border: 1px solid #00f2ff; border-radius: 15px; color: #fff; width: 300px; z-index: 100;
        }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00f2ff; margin: 10px 0; }
        .val { float: right; color: #00f2ff; font-weight: bold; }
        #status { display: block; text-align: center; margin-top: 10px; color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0; font-size: 16px; color: #00f2ff;">WRZNT WIRBEL-DYNAMIK</h2>
        <div>Radius: <span class="val" id="radVal">150</span></div>
        <input type="range" id="radiusSlide" min="40" max="250" value="150">
        
        <div>Wirbel-Intensität: <span class="val" id="ampVal">150</span></div>
        <input type="range" id="ampSlide" min="20" max="400" value="150">
        
        <div>Interferenz-Phase: <span class="val" id="freqVal">0.15</span></div>
        <input type="range" id="freqSlide" min="0.05" max="0.5" step="0.01" value="0.15">
        
        <span id="status">ROTIERENDE RAUMZEIT</span>
    </div>

    <script>
        let scene, camera, renderer, controls, gridLines, nodes;
        let electron, positron;
        let time = 0, pulses = [], isAnnihilated = false;
        let params = { radius: 150, amplitude: 150, frequency: 0.15 };

        const gridSize = 14, spacing = 55;
        let initialPos = [];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 800, 800);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);

            // Gitter Erzeugung
            const points = [];
            for (let i = -gridSize/2; i <= gridSize/2; i++) {
                for (let j = -gridSize/2; j <= gridSize/2; j++) {
                    // Liniensegmente X & Y
                    points.push(-gridSize/2*spacing, 0, i*spacing, gridSize/2*spacing, 0, i*spacing);
                    points.push(i*spacing, 0, -gridSize/2*spacing, i*spacing, 0, gridSize/2*spacing);
                }
            }
            initialPos = new Float32Array(points);
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(points), 3));
            gridLines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x004488, transparent: true, opacity: 0.5 }));
            scene.add(gridLines);

            // Knoten (Punkte)
            const nPos = [], nCol = [];
            for (let x = -gridSize/2; x <= gridSize/2; x++) {
                for (let z = -gridSize/2; z <= gridSize/2; z++) {
                    nPos.push(x*spacing, 0, z*spacing);
                    nCol.push(0, 0.5, 1);
                }
            }
            const nodeGeo = new THREE.BufferGeometry();
            nodeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nPos), 3));
            nodeGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(nCol), 3));
            nodes = new THREE.Points(nodeGeo, new THREE.PointsMaterial({ size: 6, vertexColors: true }));
            scene.add(nodes);

            electron = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            positron = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshBasicMaterial({ color: 0x0088ff }));
            scene.add(electron, positron);

            document.getElementById('radiusSlide').oninput = (e) => {
                params.radius = +e.target.value;
                document.getElementById('radVal').innerText = params.radius;
                if(params.radius <= 44 && !isAnnihilated) {
                    isAnnihilated = true;
                    // Zwei Pulse für Interferenz-Demo
                    pulses.push({ t0: time, ox: 0, oz: 0, shift: time });
                    document.getElementById('status').innerText = "WIRBEL-INTERFERENZ";
                } else if(params.radius > 45) {
                    isAnnihilated = false;
                    document.getElementById('status').innerText = "ROTIERENDE RAUMZEIT";
                }
            };
            document.getElementById('ampSlide').oninput = (e) => { params.amplitude = +e.target.value; document.getElementById('ampVal').innerText = params.amplitude; };
            document.getElementById('freqSlide').oninput = (e) => { params.frequency = +e.target.value; document.getElementById('freqVal').innerText = params.frequency; };

            animate();
        }

        function calculateVortex(x, y, z, px, pz) {
            let dx = x, dy = y, dz = z;
            let energy = 0;

            // Materie-Rotation
            if(!isAnnihilated) {
                let d1 = Math.sqrt((x-px)**2 + (z-pz)**2);
                let d2 = Math.sqrt((x+px)**2 + (z+pz)**2);
                dy += (-200 / (d1/10 + 5)) + (200 / (d2/10 + 5));
                energy = Math.abs(dy) * 0.05;
            }

            // Undatron-Wirbel (Kreisbewegung der Punkte)
            pulses.forEach(p => {
                let dist = Math.sqrt((x-p.ox)**2 + (z-p.oz)**2);
                let age = time - p.t0;
                let waveR = age * 12;
                let d = dist - waveR;
                let env = Math.exp(-(d*d) / 3000);

                if (env > 0.01) {
                    let angle = Math.atan2(z - p.oz, x - p.ox);
                    // Die Rotation wird auf die X- und Z-Position der Punkte addiert
                    let phase = angle - (dist * 0.05) + (age * 0.8) + p.shift;
                    let rotAmount = Math.sin(phase) * Math.sin(d * params.frequency) * params.amplitude * env;
                    
                    // Lokale Kreisbewegung (Vortex)
                    dx += Math.cos(angle + phase) * rotAmount * 0.5;
                    dz += Math.sin(angle + phase) * rotAmount * 0.5;
                    dy += rotAmount; // Vertikale Verdichtung
                    energy += Math.abs(rotAmount) * 0.03;
                }
            });

            return { x: dx, y: dy, z: dz, energy };
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;
            controls.update();

            let px = Math.cos(time) * params.radius;
            let pz = Math.sin(time) * params.radius;
            electron.visible = positron.visible = !isAnnihilated;
            if(!isAnnihilated) {
                electron.position.set(px, 0, pz);
                positron.position.set(-px, 0, -pz);
            }

            const lPos = gridLines.geometry.attributes.position.array;
            for (let i = 0; i < lPos.length; i += 3) {
                let res = calculateVortex(initialPos[i], initialPos[i+1], initialPos[i+2], px, pz);
                lPos[i] = res.x; lPos[i+1] = res.y; lPos[i+2] = res.z;
            }
            gridLines.geometry.attributes.position.needsUpdate = true;

            const nPos = nodes.geometry.attributes.position.array;
            const nCol = nodes.geometry.attributes.color.array;
            for (let i = 0; i < nPos.length; i += 3) {
                let ix = (Math.floor((i/3) / (gridSize+1)) - gridSize/2) * spacing;
                let iz = ((i/3) % (gridSize+1) - gridSize/2) * spacing;
                let res = calculateVortex(ix, 0, iz, px, pz);
                nPos[i] = res.x; nPos[i+1] = res.y; nPos[i+2] = res.z;
                nCol[i] = Math.min(1, 0.1 + res.energy * 2.5);
                nCol[i+1] = Math.min(1, 0.4 + res.energy * 4);
                nCol[i+2] = Math.max(0.2, 1.0 - res.energy);
            }
            nodes.geometry.attributes.position.needsUpdate = true;
            nodes.geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
