<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRZNT 3D Wellennetz mit Doppelspalt</title>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
    <script src="script.js"></script>
  
  </head>  
  
  <body>

    <link rel="stylesheet" href="styles.css" />
    
    <p id="currentTime"></p>
    
    <div id="container"></div>
    
    <div class="header">
        <h1>WRZNT 3D Wellennetz mit Doppelspalt</h1>
        <p>Klicken für Wellen | Ziehen zum Drehen</p>
    </div>
    
    <div class="info">
        <div>Aktive Wellen: <span id="waveCount">0</span></div>
    </div>
    
    <div class="controls">
      <div class="control-group">
          <label>Amplitude</label>
          <input type="range" id="amplitude" min="1" max="50" value="5" step="1">
          <span class="value" id="amplitudeValue">5</span>
      </div>
      
      <div class="control-group">
          <label>Frequenz</label>
          <input type="range" id="frequency" min="0.1" max="100" value="5" step="0.1">
          <span class="value" id="frequencyValue">5</span>
      </div>
      
      <div class="control-group">
          <label>Geschwindigkeit</label>
          <input type="range" id="speed" min="1" max="100" value="5">
          <span class="value" id="speedValue">5</span>
      </div>

      <div class="control-group">
          <label>Radius</label>
          <input type="range" id="radius" min="0" max="100" value="50">
          <span class="value" id="radiusValue">50</span>
      </div>
      
      <div class="control-group">
          <label>Spalt-Position</label>
          <input type="range" id="barrierPos" min="-300" max="300" value="0" step="10">
          <span class="value" id="barrierPosValue">0</span>
      </div>
      
      <div class="control-group">
          <label>Spaltabstand</label>
          <input type="range" id="slitGap" min="2" max="200" value="50" step="1">
          <span class="value" id="slitGapValue">50</span>
      </div>
      
      <div class="control-group">
          <label>Spaltbreite</label>
          <input type="range" id="slitWidth" min="1" max="100" value="20" step="1">
          <span class="value" id="slitWidthValue">20</span>
      </div>
      
      <div class="control-group">
          <label>Schirm-Position</label>
          <input type="range" id="screenPos" min="-400" max="400" value="350" step="10">
          <span class="value" id="screenPosValue">300</span>
      </div>
      
      <div class="buttons">
          <button id="wavefrontBtn">Wellenfront</button>
          <button id="wavepntBtn">Wellepunkt</button>
          <button id="barrierBtn">Doppelspalt</button>
          <button id="screenBtn">Schirm</button>
          <button id="rotatingSourcesBtn">Rotierende Quellen</button>
          <button id="pauseBtn">Pause</button>
          <button id="resetBtn">Reset</button>
      </div>
      
    </div>
    
    <script>
      
    init();
    
    showTime();
    
    setInterval(function () {
      showTime();
    }, 1000);
    
    </script>
    
  </body>
  
  
</html>
