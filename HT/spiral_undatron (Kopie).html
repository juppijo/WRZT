<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>WRZNT - 3D Spiral Vortex Interferenz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(10,10,30,0.9); padding: 20px; border: 1px solid #4a9eff; border-radius: 12px; z-index: 100; width: 300px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00f2ff; margin-bottom: 10px; }
        .label { font-size: 11px; color: #4a9eff; text-transform: uppercase; }
        .val { float: right; color: #ffcc00; font-weight: bold; }
        button { background: #ff3344; border: none; color: white; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="margin:0 0 15px 0; font-size: 18px; color: #4a9eff;">WRZNT Vortex Engine</h2>
        <div><span class="label">Radius</span> <span class="val" id="radVal">150</span></div>
        <input type="range" id="radiusSlide" min="40" max="250" value="150">
        
        <div><span class="label">Amplitude</span> <span class="val" id="ampVal">120</span></div>
        <input type="range" id="ampSlide" min="10" max="300" value="120">
        
        <div><span class="label">Frequenz</span> <span class="val" id="freqVal">0.15</span></div>
        <input type="range" id="freqSlide" min="0.05" max="0.5" step="0.01" value="0.15">
        
        <button id="emitBtn">UNDATRON EMISSION</button>
    </div>

    <script>
        let scene, camera, renderer, nodes, gridLines;
        let time = 0, pulses = [];
        let params = { radius: 150, amp: 120, freq: 0.15 };

        const gridSize = 16, spacing = 50;
        let basePositions = [];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 800, 800);
            camera.lookAt(0,0,0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Gitter Erzeugung (X-Z Ebene)
            const points = [];
            for (let i = -gridSize/2; i <= gridSize/2; i++) {
                for (let j = -gridSize/2; j <= gridSize/2; j++) {
                    points.push(-gridSize/2*spacing, 0, i*spacing, gridSize/2*spacing, 0, i*spacing);
                    points.push(i*spacing, 0, -gridSize/2*spacing, i*spacing, 0, gridSize/2*spacing);
                }
            }
            basePositions = new Float32Array(points);
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(points), 3));
            gridLines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x004488, transparent: true, opacity: 0.4 }));
            scene.add(gridLines);

            // Knotenpunkte
            const nPos = [], nCol = [];
            for (let x = -gridSize/2; x <= gridSize/2; x++) {
                for (let z = -gridSize/2; z <= gridSize/2; z++) {
                    nPos.push(x*spacing, 0, z*spacing);
                    nCol.push(0, 0.5, 1);
                }
            }
            const nodeGeo = new THREE.BufferGeometry();
            nodeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nPos), 3));
            nodeGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(nCol), 3));
            nodes = new THREE.Points(nodeGeo, new THREE.PointsMaterial({ size: 5, vertexColors: true }));
            scene.add(nodes);

            // Event Listeners
            document.getElementById('emitBtn').onclick = () => {
                // Zwei Quellen im Zentrum, rotierend
                pulses.push({ t0: time, shift: 0 });
            };
            document.getElementById('radiusSlide').oninput = (e) => { params.radius = +e.target.value; document.getElementById('radVal').innerText = params.radius; };
            document.getElementById('ampSlide').oninput = (e) => { params.amp = +e.target.value; document.getElementById('ampVal').innerText = params.amp; };
            document.getElementById('freqSlide').oninput = (e) => { params.freq = +e.target.value; document.getElementById('freqVal').innerText = params.freq; };

            animate();
        }

        function getVortexDeformation(x, y, z) {
            let dx = x, dy = y, dz = z;
            let totalIntensity = 0;

            pulses.forEach(p => {
                let age = time - p.t0;
                let waveSpeed = 15;
                let waveR = age * waveSpeed;
                
                // Wir berechnen zwei Quellen, die sich gegenüberstehen (wie in deinem 2P File)
                const rotSpeed = 0.8;
                let q1x = Math.cos(time * rotSpeed) * params.radius;
                let q1z = Math.sin(time * rotSpeed) * params.radius;
                
                let q2x = -q1x;
                let q2z = -q1z;

                // Deformation von Quelle 1
                let dist1 = Math.sqrt((x - q1x)**2 + (z - q1z)**2);
                let env1 = Math.exp(-Math.pow(dist1 - waveR, 2) / 3500);
                
                if (env1 > 0.01) {
                    let angle1 = Math.atan2(z - q1z, x - q1x);
                    let phase1 = angle1 - (dist1 * params.freq) + (age * rotSpeed);
                    let amp = Math.sin(phase1) * params.amp * env1;
                    
                    // Lokale Kreisbewegung (Vortex)
                    dx += Math.cos(phase1) * amp * 0.4;
                    dz += Math.sin(phase1) * amp * 0.4;
                    dy += amp;
                    totalIntensity += Math.abs(amp);
                }

                // Deformation von Quelle 2
                let dist2 = Math.sqrt((x - q2x)**2 + (z - q2z)**2);
                let env2 = Math.exp(-Math.pow(dist2 - waveR, 2) / 3500);
                
                if (env2 > 0.01) {
                    let angle2 = Math.atan2(z - q2z, x - q2x);
                    let phase2 = angle2 - (dist2 * params.freq) + (age * rotSpeed);
                    let amp2 = Math.sin(phase2) * params.amp * env2;
                    
                    dx += Math.cos(phase2) * amp2 * 0.4;
                    dz += Math.sin(phase2) * amp2 * 0.4;
                    dy += amp2;
                    totalIntensity += Math.abs(amp2);
                }
            });

            return { x: dx, y: dy, z: dz, intensity: totalIntensity };
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.04;

            const lPos = gridLines.geometry.attributes.position.array;
            for (let i = 0; i < lPos.length; i += 3) {
                let res = getVortexDeformation(basePositions[i], basePositions[i+1], basePositions[i+2]);
                lPos[i] = res.x; lPos[i+1] = res.y; lPos[i+2] = res.z;
            }
            gridLines.geometry.attributes.position.needsUpdate = true;

            const nPos = nodes.geometry.attributes.position.array;
            const nCol = nodes.geometry.attributes.color.array;
            for (let i = 0; i < nPos.length; i += 3) {
                let ix = (Math.floor((i/3) / (gridSize+1)) - gridSize/2) * spacing;
                let iz = ((i/3) % (gridSize+1) - gridSize/2) * spacing;
                let res = getVortexDeformation(ix, 0, iz);
                nPos[i] = res.x; nPos[i+1] = res.y; nPos[i+2] = res.z;
                
                // Farbe basierend auf Interferenz-Intensität
                nCol[i] = Math.min(1, 0.1 + res.intensity * 0.01);
                nCol[i+1] = Math.min(1, 0.3 + res.intensity * 0.02);
                nCol[i+2] = Math.max(0.2, 1.0 - res.intensity * 0.01);
            }
            nodes.geometry.attributes.position.needsUpdate = true;
            nodes.geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
