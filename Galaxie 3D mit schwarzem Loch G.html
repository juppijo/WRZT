<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRZT Galaxien-Simulation - Wellenraumzeit-Theorie</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #ui-panel.collapsed {
            transform: translateX(-340px);
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 1.1rem;
            color: #7ab8ff;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #8892b0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #ccd6f6;
        }
        label span {
            color: #64ffda;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #64ffda;
            background: #112240;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }
        /* Neustart Button */
        #restart-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #64ffda);
            border: none;
            color: #030308;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        #restart-btn:hover {
            opacity: 0.9;
        }
        /* Toggle Button für Regler */
        #toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 11;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            color: #64ffda;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        #toggle-btn:hover {
            background: rgba(20, 30, 50, 0.95);
        }
        /* Vollbild Button */
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 11;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 150, 255, 0.3);
            color: #64ffda;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        #fullscreen-btn:hover {
            background: rgba(20, 30, 50, 0.95);
        }
        .info-text {
            font-size: 0.75rem;
            color: #8892b0;
            margin-top: 15px;
            line-height: 1.4;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }
    </style>
    <!-- Three.js & OrbitControls laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <button id="toggle-btn" onclick="toggleUI()">⚙️ WRZT Regler</button>
    <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Vollbild</button>

    <div id="ui-panel">
        <h1>WRZT Galaxie-Modell</h1>
        <div class="subtitle">Wellenraumzeit-Dynamik</div>

        <div class="control-group">
            <label>Netzwerk-Frequenz: <span id="val-freq">1.50</span></label>
            <input type="range" id="freqRange" min="0.2" max="4.0" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <label>Wellen-Amplitude (Spannung): <span id="val-amp">1.20</span></label>
            <input type="range" id="ampRange" min="0.0" max="3.0" step="0.1" value="1.2">
        </div>

        <div class="control-group">
            <label>Wirbel-Rotation: <span id="val-rot">1.00</span></label>
            <input type="range" id="rotRange" min="0.0" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>Gasmengen-Dichte: <span id="val-gas">8000</span></label>
            <input type="range" id="gasRange" min="2000" max="15000" step="1000" value="8000">
        </div>

        <button id="restart-btn" onclick="restartSimulation()">🔄 Galaxie Neustarten</button>

        <div class="info-text">
            <b>Maus-Steuerung:</b> Linksklick + Ziehen = Rotieren | Rechtsklick + Ziehen = Verschieben | Mausrad = Zoom.
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // UI Einklappen / Ausklappen
        let uiVisible = true;
        function toggleUI() {
            const panel = document.getElementById('ui-panel');
            const btn = document.getElementById('toggle-btn');
            uiVisible = !uiVisible;
            if (uiVisible) {
                panel.classList.remove('collapsed');
                btn.textContent = '⚙️ WRZT Regler';
            } else {
                panel.classList.add('collapsed');
                btn.textContent = '⚙️ Regler öffnen';
            }
        }

        // Vollbild Funktion
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // OrbitControls für Maus-Interaktion (Rotieren, Zoomen, Verschieben)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 250;
        controls.minDistance = 5;

        // Parameter-Variablen
        let waveFreq = 1.5;
        let waveAmp = 1.2;
        let rotSpeed = 1.0;
        let particleCount = 8000;
        let clock = new THREE.Clock();

        // --- 1. ERSTELLUNG DES WELLENNETZWERKS (Hintergrund-Gitter) ---
        const gridDimX = 40;
        const gridDimZ = 40;
        const gridSpacing = 2.5;
        const geometryGrid = new THREE.BufferGeometry();
        const gridPositions = [];

        for (let x = 0; x < gridDimX; x++) {
            for (let z = 0; z < gridDimZ; z++) {
                const posX = (x - gridDimX / 2) * gridSpacing;
                const posZ = (z - gridDimZ / 2) * gridSpacing;
                gridPositions.push(posX, 0, posZ);
            }
        }
        geometryGrid.setAttribute('position', new THREE.Float32BufferAttribute(gridPositions, 3));

        const materialGrid = new THREE.PointsMaterial({
            color: 0x3b82f6,
            size: 0.35,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        const waveNetwork = new THREE.Points(geometryGrid, materialGrid);
        scene.add(waveNetwork);

        // --- 2. ERSTELLUNG DER GALAXIE (Sterne & Gaswolken) ---
        let galaxyParticles, galaxyGeometry;
        let particleData = [];

        function initGalaxy() {
            if (galaxyParticles) scene.remove(galaxyParticles);

            galaxyGeometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            particleData = [];

            const colorCore = new THREE.Color(0xfff3aa); // Warmes Kernlicht
            const colorArm1 = new THREE.Color(0x64ffda); // Türkise Arme
            const colorArm2 = new THREE.Color(0x3b82f6); // Bläuliche Außenbereiche

            for (let i = 0; i < particleCount; i++) {
                const radius = Math.pow(Math.random(), 1.8) * 28;
                const armIndex = Math.floor(Math.random() * 2);
                const armOffset = (armIndex * Math.PI);
                const spiralAngle = radius * 0.35 + armOffset + (Math.random() - 0.5) * 0.6;
                const heightSpread = (Math.random() - 0.5) * (3.5 / (radius * 0.2 + 1));

                const x = Math.cos(spiralAngle) * radius;
                const z = Math.sin(spiralAngle) * radius;
                const y = heightSpread;

                positions.push(x, y, z);

                let mixedColor = new THREE.Color();
                if (radius < 5) {
                    mixedColor.copy(colorCore);
                } else {
                    let lerpFactor = (radius - 5) / 23;
                    mixedColor.copy(colorArm1).lerp(colorArm2, lerpFactor);
                }
                colors.push(mixedColor.r, mixedColor.g, mixedColor.b);

                particleData.push({
                    radius: radius,
                    angle: spiralAngle,
                    speed: (1 / (radius + 1.5)) * 1.5
                });
            }

            galaxyGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            galaxyGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const particleTexture = createStarTexture();
            const materialGalaxy = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                map: particleTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(galaxyGeometry, materialGalaxy);
            scene.add(galaxyParticles);
            clock = new THREE.Clock(); // Reset clock for clean start
        }

        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(100,200,255,0.8)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        initGalaxy();

        // Neustart-Funktion
        function restartSimulation() {
            initGalaxy();
        }

        // --- 3. UI EVENT LISTENER ---
        const freqRange = document.getElementById('freqRange');
        const ampRange = document.getElementById('ampRange');
        const rotRange = document.getElementById('rotRange');
        const gasRange = document.getElementById('gasRange');

        freqRange.addEventListener('input', (e) => {
            waveFreq = parseFloat(e.target.value);
            document.getElementById('val-freq').textContent = waveFreq.toFixed(2);
        });
        ampRange.addEventListener('input', (e) => {
            waveAmp = parseFloat(e.target.value);
            document.getElementById('val-amp').textContent = waveAmp.toFixed(2);
        });
        rotRange.addEventListener('input', (e) => {
            rotSpeed = parseFloat(e.target.value);
            document.getElementById('val-rot').textContent = rotSpeed.toFixed(2);
        });
        gasRange.addEventListener('input', (e) => {
            particleCount = parseInt(e.target.value);
            document.getElementById('val-gas').textContent = particleCount;
            initGalaxy();
        });

        // --- ANIMATIONSSCHLEIFE ---
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // 1. Wellennetzwerk oszillieren lassen
            const positionsGrid = waveNetwork.geometry.attributes.position.array;
            let index = 0;
            for (let x = 0; x < gridDimX; x++) {
                for (let z = 0; z < gridDimZ; z++) {
                    const posX = positionsGrid[index];
                    const posZ = positionsGrid[index + 2];
                    const distFromCenter = Math.sqrt(posX * posX + posZ * posZ);
                    
                    const waveY = Math.sin(distFromCenter * 0.25 - elapsedTime * waveFreq) * waveAmp * Math.exp(-distFromCenter * 0.04);
                    positionsGrid[index + 1] = waveY;
                    index += 3;
                }
            }
            waveNetwork.geometry.attributes.position.needsUpdate = true;

            // 2. Galaxie rotieren lassen
            if (galaxyParticles) {
                const positionsGalaxy = galaxyParticles.geometry.attributes.position.array;
                for (let i = 0; i < particleData.length; i++) {
                    const data = particleData[i];
                    data.angle += data.speed * 0.01 * rotSpeed;

                    const x = Math.cos(data.angle) * data.radius;
                    const z = Math.sin(data.angle) * data.radius;

                    positionsGalaxy[i * 3] = x;
                    positionsGalaxy[i * 3 + 2] = z;
                }
                galaxyParticles.geometry.attributes.position.needsUpdate = true;
                galaxyParticles.rotation.y = elapsedTime * 0.05 * rotSpeed;
            }

            // Controls aktualisieren für geschmeidige Dämpfung
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Anpassung
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
