<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LWT Labor v10 - Unified Theory</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: #00ffcc;
            background: rgba(0, 10, 20, 0.9); padding: 15px; border-radius: 12px;
            border: 1px solid #00ffcc; z-index: 100; width: 280px; max-height: 90vh; overflow-y: auto;
        }
        h1 { margin: 0 0 10px 0; font-size: 15px; text-transform: uppercase; color: #ffcc00; border-bottom: 1px solid #333; }
        label { display: block; font-size: 10px; color: #aaa; margin-top: 8px; }
        input[type=range] { width: 100%; accent-color: #00ffcc; cursor: pointer; }
        button { width: 100%; padding: 8px; margin-top: 8px; cursor: pointer; font-weight: bold; border-radius: 4px; border:none; background: #00ffcc; color: #000; }
        .stat { font-family: monospace; font-size: 11px; margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; line-height: 1.4; }
        #hint { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); color: #ffcc00; text-align: center; pointer-events: none; font-size: 12px; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px;}
    </style>
</head>
<body>

<div id="ui">
    <h1>LWT Unified Lab v10</h1>

    <label>Raster-Detail (Auflösung)</label>
    <input type="range" id="resIn" min="20" max="200" value="100">
    
    <label>Ur-Anflug Tempo</label>
    <input type="range" id="speedIn" min="1" max="200" value="40">

    <label>Wellen-Frequenz (Undatron)</label>
    <input type="range" id="freqIn" min="0.1" max="100" value="4">

    <label>Knoten-Masse (Gravitation)</label>
    <input type="range" id="massIn" min="1" max="400" value="80">

    <label>Interaktions-Kraft (G-Kraft)</label>
    <input type="range" id="forceIn" min="1" max="400" value="80">

    <label>Wellenring-Breite (Paket)</label>
    <input type="range" id="ringWidthIn" min="1" max="800" value="100">
    
    <button id="pauseBtn">PAUSE PHYSIK</button>
    <button id="clearBtn" style="background:#555; color:white;">MANUELLE KNOTEN LÖSCHEN</button>
    <button id="fsBtn" style="background:#ff4444; color:white;">VOLLBILD</button>

    <div class="stat">
        Ur-Phase: <span id="phaseVal" style="color:white">-</span><br>
        Manuelle Teilchen: <span id="pCount" style="color:white">0</span><br>
        Status: <span id="status" style="color:#00ffcc">Feld stabil</span>
    </div>
</div>

<div id="hint">Links-DblClick: Berg (+) | Rechts-DblClick: Tal (-) | Maus: 3D Ansicht</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // SCENE & RENDERER
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    // 2. In der Funktion calculateZ änderst du die Zeile wie folgt:
    const ringSharpness = document.getElementById('ringWidthIn').value / 100; 
    // Wir teilen durch 100, damit 30 zu 0.3 wird. 
    // Ein kleinerer Wert im Regler macht den Ring JETZT breiter.

    // 3. WELLEN
    const ringWidthFactor = document.getElementById('ringWidthIn') ? (1.05 - document.getElementById('ringWidthIn').value / 100) : 0.3;

    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.set(0, 110, 120);
    controls.enableDamping = true;

    // RAUMZEIT-NETZ DYNAMISCH
    const gridSize = 200;
    let divisions = 100; // parseInt(document.getElementById('resIn').value);

    let geo, net;

    function buildNet(res) {
        if (net) {
            scene.remove(net);
            geo.dispose();
        }
        divisions = res;
        geo = new THREE.PlaneGeometry(gridSize, gridSize, divisions, divisions);
        geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
        const mat = new THREE.MeshStandardMaterial({ vertexColors: true, wireframe: true, transparent: true, opacity: 0.25 });
        net = new THREE.Mesh(geo, mat);
        net.rotation.x = -Math.PI / 2;
        scene.add(net);
    }

    // Initialer Aufruf
    buildNet(divisions);

    // Event Listener für den Schieber
    document.getElementById('resIn').oninput = (e) => buildNet(parseInt(e.target.value));

    /*
    const geo = new THREE.PlaneGeometry(gridSize, gridSize, divisions, divisions);
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3), 3));
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, wireframe: true, transparent: true, opacity: 0.25 });
    const net = new THREE.Mesh(geo, mat);
    net.rotation.x = -Math.PI / 2;
    scene.add(net);
    */

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.PointLight(0xffffff, 3000); light.position.set(0,80,0); scene.add(light);

    // SEKTOR-MARKER
    const markers = [
        { type: 'circle', color: 0x0088ff, x: -55, z: -55 },
        { type: 'triangle', color: 0xffff00, x: 55, z: -55 },
        { type: 'square', color: 0xff0000, x: -55, z: 55 },
        { type: 'cross', color: 0x00ff00, x: 55, z: 55 }
    ];

    markers.forEach(m => {
        let pts = [];
        if(m.type === 'circle') for(let a=0; a<=Math.PI*2; a+=0.25) pts.push(new THREE.Vector3(Math.cos(a)*7+m.x, 0, Math.sin(a)*7+m.z));
        if(m.type === 'triangle') [ [0,8], [-7,-6], [7,-6], [0,8] ].forEach(p => pts.push(new THREE.Vector3(p[0]+m.x, 0, p[1]+m.z)));
        if(m.type === 'square') [ [-7,-7], [7,-7], [7,7], [-7,7], [-7,-7] ].forEach(p => pts.push(new THREE.Vector3(p[0]+m.x, 0, p[1]+m.z)));
        if(m.type === 'cross') [ [-9,0], [9,0], [0,0], [0,-9], [0,9] ].forEach(p => pts.push(new THREE.Vector3(p[0]+m.x, 0, p[1]+m.z)));
        const lGeo = new THREE.BufferGeometry().setFromPoints(pts);
        m.line = new THREE.Line(lGeo, new THREE.LineBasicMaterial({ color: m.color, linewidth: 2 }));
        scene.add(m.line);
        m.basePoints = pts.map(p => p.clone());
    });

    // VARIABLEN
    let particles = [], waves = [], time = 0, isPaused = false;
    let orbitRadius = 40, orbitAngle = 0, phase = "ANFLUG";
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // INPUTS
    const ui = {
        speed: document.getElementById('speedIn'),
        freq: document.getElementById('freqIn'),
        mass: document.getElementById('massIn'),
        force: document.getElementById('forceIn'),
        phase: document.getElementById('phaseVal'),
        pCount: document.getElementById('pCount')
    };

    // INTERAKTION
    function handleSpawn(event, type) {
        event.preventDefault();
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(net);
        if (intersects.length > 0) {
            particles.push({ x: intersects[0].point.x, z: intersects[0].point.z, vx: 0, vz: 0, type: type });
            ui.pCount.innerText = particles.length;
        }
    }

    window.addEventListener('dblclick', (e) => handleSpawn(e, 1));
    window.addEventListener('contextmenu', (e) => handleSpawn(e, -1));
    document.getElementById('clearBtn').onclick = () => { particles = []; ui.pCount.innerText = "0"; };
    document.getElementById('pauseBtn').onclick = () => { isPaused = !isPaused; document.getElementById('pauseBtn').innerText = isPaused ? "PLAY" : "PAUSE PHYSIK"; };
    document.getElementById('fsBtn').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
    
    function calculateZ(x, z) {
        let val = 0;
        
        // Parameter vom UI holen
        const currentMass = document.getElementById('massIn').value / 6;
        const currentFreq = document.getElementById('freqIn').value / 10;
        
        // DIESER WERT VERKNÜPFT DEN REGLER:
        // Wir rechnen den Schieber (1-100) in einen physikalischen Faktor um.
        // Ein kleinerer Faktor macht die Welle LONGITUDINAL BREITER.
        const ringWidth = 1 / (document.getElementById('ringWidthIn').value * 0.5);

        // 1. Manuelle Knoten
        particles.forEach(p => {
            let d = Math.sqrt((x - p.x)**2 + (z - p.z)**2);
            val += (p.type * currentMass) / (d + 2.0);
        });

        // 2. Wellen (Das Undatron)
        waves.forEach(w => {
            let d = Math.sqrt((x - (w.x || 0))**2 + (z - (w.z || 0))**2);

            // Die neue longitudinale Kopplung:
            // (d - w.r) ist der Abstand zur Wellenfront
            let phase = (d - w.r) * currentFreq;
            
            // Der 'ringWidth' Faktor vom Schieberegler bestimmt jetzt die Paketlänge
            let env = Math.exp(-Math.pow(d - w.r, 2) * ringWidth); 

            val += Math.sin(phase) * env * w.life;
        });

        // 3. Ur-Prozess (falls vorhanden)
        if (typeof phase !== 'undefined' && phase !== "RELAX") {
            let x1 = Math.cos(orbitAngle)*orbitRadius, z1 = Math.sin(orbitAngle)*orbitRadius;
            let x2 = Math.cos(orbitAngle+Math.PI)*orbitRadius, z2 = Math.sin(orbitAngle+Math.PI)*orbitRadius;
            
            // Wir nutzen currentMass * 2, da die Ur-Knoten oft massiver dargestellt werden
            val -= (currentMass * 2) / (Math.sqrt((x-x1)**2 + (z-z1)**2) + 1.8);
            val += (currentMass * 2) / (Math.sqrt((x-x2)**2 + (z-z2)**2) + 1.8);
        }

        return val;
    }

    function updatePhysics() {
        const fScale = document.getElementById('forceIn').value / 1500;
        
        // 1. UR-PROZESS LOGIK (Anflug der Knoten)
        if (phase === "ANFLUG") {
            orbitAngle += 0.05;
            orbitRadius -= 0.15; // Geschwindigkeit des Zusammenziehens
            if (orbitRadius < 1.8) {
                phase = "WAND"; // Übergang zur Wellenentstehung
                // Erzeuge die Hauptwelle (Das Undatron)
                waves.push({ x: 0, z: 0, r: 0, life: 15 }); 
            }
        } else if (phase === "WAND") {
            phase = "RELAX"; // Kurze Pause nach dem Knall
        }

        // 2. TEILCHEN-PHYSIK (Manuelle Knoten)
        for (let i = 0; i < particles.length; i++) {
            let p1 = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j];
                let dx = p2.x - p1.x, dz = p2.z - p1.z;
                let d2 = dx*dx + dz*dz, d = Math.sqrt(d2);

                if (d < 3.0) { // Annihilation bei Kontakt
                    waves.push({ x: (p1.x+p2.x)/2, z: (p1.z+p2.z)/2, r: 0, life: 10 });
                    particles.splice(j, 1);
                    particles.splice(i, 1);
                    document.getElementById('pCount').innerText = particles.length;
                    return;
                }

                if (d < 110) {
                    let f = fScale / (d2 + 1);
                    let dir = (p1.type === p2.type) ? -1 : 1;
                    p1.vx += (dx/d)*f*dir; p1.vz += (dz/d)*f*dir;
                    p2.vx -= (dx/d)*f*dir; p2.vz -= (dz/d)*f*dir;
                }
            }
            p1.x += p1.vx; p1.z += p1.vz;
            p1.vx *= 0.97; p1.vz *= 0.97;
        }

        // 3. WELLEN-PHYSIK (Hier ist die Änderung!)
        waves.forEach(w => { 
            w.r += 0.6;         // Longitudinaler Vorschub (Ausbreitung nach außen)
            w.life *= 0.99;    // Sehr schwache Dämpfung - Welle bleibt lange sichtbar
        });

        // BEREINIGUNG: Löscht Wellen erst, wenn sie wirklich keine Energie mehr haben
        // Das verhindert das plötzliche Verschwinden
        waves = waves.filter(w => w.life > 0.05);

        // RESET DES UR-ZYKLUS
        // Startet erst neu, wenn alle Wellen den Raum verlassen haben oder abgeklungen sind
        if (phase === "RELAX" && waves.length === 0) {
            orbitRadius = 40;
            phase = "ANFLUG";
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        if (!isPaused) {
            time += 0.02;
            updatePhysics();
        }

        const pos = geo.attributes.position;
        const col = geo.attributes.color;

        // Aktuelle Breite für den optischen Glow vom Schieber abrufen
        // Je kleiner der Schieber-Wert, desto breiter das Leuchten
        let glowWidth = 150 / (document.getElementById('ringWidthIn').value || 20);

        for (let i = 0; i < pos.count; i++) {
            let px = pos.getX(i), pz = pos.getY(i);
            
            // Physikalische Höhe berechnen
            let z = calculateZ(px, pz); 
            pos.setZ(i, z);

            // Basis-Farbe (Dunkelblau)
            let r = 0.05, g = 0.08, b = 0.25;

            // Färbung durch Krümmung (Berge = Rot, Täler = Blau-Hell)
            if (z > 0.4) r += z * 0.25; 
            if (z < -0.4) b += Math.abs(z) * 0.25;
            
            // Optischer WELLEN-GLOW
            waves.forEach(w => {
                let dx = px - (w.x || 0);
                let dz = pz - (w.z || 0);
                let d = Math.sqrt(dx*dx + dz*dz);
                
                // Wenn der Punkt innerhalb des Glow-Bereichs der Wellenfront liegt
                if (Math.abs(d - w.r) < glowWidth) { 
                    r += 0.4; 
                    g += 0.35; 
                    b *= 0.4; 
                }
            });

            col.setXYZ(i, r, g, b);
        }

        // Three.js mitteilen, dass sich Positionen und Farben geändert haben
        pos.needsUpdate = true;
        col.needsUpdate = true;

        // Markierungs-Linien (Sektoren) aktualisieren
        markers.forEach(m => {
            const lp = m.line.geometry.attributes.position;
            for (let j = 0; j < m.basePoints.length; j++) {
                let bp = m.basePoints[j];
                lp.setXYZ(j, bp.x, calculateZ(bp.x, bp.z), bp.z);
            }
            lp.needsUpdate = true;
        });

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
