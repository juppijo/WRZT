<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Laser-Labor 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#05070d;--pn:rgba(14,19,32,.86);--ln:#27304a;--tx:#dfe6f5;--mu:#8a95b3;--ac:#4cc9f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{position:relative;height:100%;width:100%;background:var(--bg)}
#app>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hd{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;touch-action:none}.hd .tg{margin-left:auto;transition:.2s;color:var(--mu)}
.pn.c>*:not(.hd){display:none}.pn.c .tg{transform:rotate(-90deg)}#top.c{right:auto}
#tiles{position:absolute;left:190px;right:262px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;pointer-events:none}
#tiles .pn{position:relative;pointer-events:auto;width:196px;font-size:12px}
.tile canvas{width:100%;display:block;border-radius:6px;margin-top:6px;background:#000}.tile .inf{margin-top:6px;color:var(--mu);line-height:1.5}.tile .inf b{color:var(--ac)}
.tb2{color:var(--mu);padding:0 4px;cursor:pointer;font-size:14px}.tb2:hover{color:var(--ac)}.tile .hd b{margin-right:auto}.tile .tg{margin-left:0}
.tile:fullscreen{width:100vw!important;height:100vh;box-sizing:border-box;padding:24px;overflow:auto;border-radius:0;font-size:20px!important;background:#070b14}
.tile:fullscreen .tv{width:auto;max-width:100%;height:58vh;margin:12px auto 0}.tile:fullscreen .pf{width:100%;height:22vh}
@media(max-width:720px){#tiles{left:10px;right:10px;top:62px;bottom:auto}}
.pn{position:absolute;background:var(--pn);backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:12px;padding:10px;box-sizing:border-box}
#top{left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;padding:6px 10px;flex-wrap:wrap}
#top h1{font-size:15px;margin:0 auto 0 0;font-weight:600}#top h1 span{color:var(--ac)}
#tb{left:10px;top:62px;width:170px;display:flex;flex-direction:column;gap:5px;max-height:calc(100% - 80px);overflow:auto}
#pp{right:10px;top:62px;width:240px;max-height:calc(100% - 80px);overflow:auto}
button,select{background:#18203a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;font:inherit;cursor:pointer;text-align:left}
button:hover,select:hover{border-color:var(--ac);background:#1d2848}
#tb button b{color:var(--ac);margin-right:5px}
h4{margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}h4:first-child{margin-top:0}
label{display:block;margin:7px 0}label b{float:right;color:var(--ac);font-weight:500}label.ck{display:flex;gap:6px;align-items:center}
input[type=range]{width:100%;accent-color:var(--ac)}.mu{color:var(--mu);margin:4px 0}
#toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ln);padding:8px 14px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
@media(max-width:720px){#tb{top:auto;bottom:10px;left:10px;right:10px;width:auto;flex-direction:row;max-height:none;overflow-x:auto}#tb button{white-space:nowrap;flex:0 0 auto}#tb h4{display:none}#pp{top:auto;bottom:70px;width:210px;max-height:38%}}
</style></head><body>
<div id="app">
<div id="top" class="pn"><h1 class="hd">🔦 Laser-Labor <span>3D</span> <span class="tg">▾</span></h1>
<select id="pre"><option value="">Beispiel laden …</option><option value="0">Doppelspalt-Interferenz</option><option value="1">Prisma &amp; Weißlicht</option><option value="2">Polarisation (Malus)</option><option value="3">Verschränkungs-Kristall</option><option value="4">Linse &amp; Spiegel</option><option value="5">Weißlicht-Doppelspalt (Farbstreifen)</option><option value="6">Spiegel-Rundkurs + Polarisator + Doppelspalt</option><option value="7">Michelson-Aufbau (Strahlteiler + 2 Spiegel)</option><option value="8">Periskop (Höhenversatz)</option><option value="9">Kepler-Teleskop (2 Linsen)</option><option value="10">Polarisations-Weiche (2 Schirme)</option><option value="11">Verschränkung + Analysatoren</option></select>
<button id="all" title="Alle Fenster ein- oder ausklappen">⇕ Fenster</button><button id="clr">Leeren</button><button id="sv">💾 Speichern</button><button id="ldb">📂 Laden</button><input type="file" id="ld" accept=".json,application/json" hidden><button id="fs">⛶ Vollbild</button></div>
<div id="tb" class="pn"><h4 class="hd">Bauteile <span class="tg">▾</span></h4></div>
<div id="pp" class="pn"><h4 class="hd">Einstellungen <span class="tg">▾</span></h4>
<h4>Laser</h4>
<label>Wellenlänge <b id="wlv">650 nm</b><input type="range" id="wl" min="400" max="700" value="650"></label>
<label class="ck"><input type="checkbox" id="wh"> Weißlicht (Spektrum)</label>
<label>Polarisation <b id="plv">0°</b><input type="range" id="pl" min="0" max="180" value="0"></label>
<label class="ck"><input type="checkbox" id="un"> unpolarisiert</label>
<h4>Auswahl</h4><div id="sp"></div></div>
<div id="tiles"></div><div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),D=Math.PI/180,V=THREE.Vector3,app=$('app');
const NAME={laser:'Laser',mirror:'Spiegel',lens:'Linse',prism:'Prisma',pol:'Polarisationsfilter',split:'Strahlteiler',bbo:'Verschränkungs-Kristall (BBO)',slit:'Doppelspalt',screen:'Schirm'};
const LIM={mirror:{r:.6},lens:{r:.5},pol:{r:.45},split:{r:.45},bbo:{r:.35},screen:{a:1.2,b:.7},slit:{a:.7,b:.6}};
const KEYS=['type','x','y','z','yaw','pitch','f','al','d','a','wl','white','pol','unpol'];
let els=[],sel=null,uid=1,main=[],fan=[],drag=null,tt=0,W=1,H=1;
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2600)}
function rgb(w){let r=0,g=0,b=0;
 if(w<440){r=(440-w)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=(510-w)/20}else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=(645-w)/65}else r=1;
 const f=w<420?.35+.65*(w-380)/40:w>680?.5:1;return[r*f,g*f,b*f]}
/* three.js Szene */
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true})}catch(e){document.body.insertAdjacentHTML('beforeend','<p style="padding:80px 20px">WebGL wird von diesem Browser nicht unterstützt.</p>')}
const cv=renderer.domElement;app.prepend(cv);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070d);scene.fog=new THREE.FogExp2(0x05070d,.012);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);
let az=-.55,el=.55,rad=13,tgt=new V(0,.8,0);
function cam(){camera.position.set(tgt.x+rad*Math.cos(el)*Math.cos(az),tgt.y+rad*Math.sin(el),tgt.z+rad*Math.cos(el)*Math.sin(az));camera.lookAt(tgt)}
function resize(){W=app.clientWidth;H=app.clientHeight;renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
scene.add(new THREE.AmbientLight(0x8090b0,.9));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(4,10,6);scene.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(26,16).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x090d18}));scene.add(floor);
const grid=new THREE.GridHelper(26,26,0x2a3558,0x151c33);grid.position.y=.002;scene.add(grid);
/* Strahlen: Zylinder (Instanzen) + Linien (Fächer) */
const CAP=1500,BM={transparent:true,blending:THREE.AdditiveBlending,depthWrite:false};
const core=new THREE.InstancedMesh(new THREE.CylinderGeometry(.014,.014,1,6,1,true),new THREE.MeshBasicMaterial({...BM}),CAP),
 glow=new THREE.InstancedMesh(new THREE.CylinderGeometry(.06,.06,1,8,1,true),new THREE.MeshBasicMaterial({...BM}),CAP);
for(const m of[core,glow]){m.frustumCulled=false;m.setColorAt(0,new THREE.Color(0,0,0));m.count=0;scene.add(m)}
const FC=7000,fp=new Float32Array(FC*6),fcol=new Float32Array(FC*6),fg=new THREE.BufferGeometry();
fg.setAttribute('position',new THREE.BufferAttribute(fp,3));fg.setAttribute('color',new THREE.BufferAttribute(fcol,3));fg.setDrawRange(0,0);
const fl=new THREE.LineSegments(fg,new THREE.LineBasicMaterial({vertexColors:true,...BM}));fl.frustumCulled=false;scene.add(fl);
/* Bauteile */
function frameOf(e){const cy=Math.cos(e.yaw),sy=Math.sin(e.yaw),cp=Math.cos(e.pitch),sp=Math.sin(e.pitch);
 e.c=new V(e.x,e.y,e.z);e.n=new V(cp*cy,sp,cp*sy);e.u=new V(sy,0,-cy);e.v=new V().crossVectors(e.n,e.u)}
function add(type,x,z,yawD,ex){const e={id:uid++,type,x,y:1,z,yaw:(yawD||0)*D,pitch:0,...ex};
 if(type==='lens'&&!e.f)e.f=3;if(type==='pol'&&e.al==null)e.al=0;if(type==='slit'){e.d=e.d||30;e.a=e.a||6}
 if(type==='laser'){e.wl=e.wl||650;e.white=!!e.white;e.pol=e.pol||0;e.unpol=!!e.unpol}
 e.post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,8),new THREE.MeshPhongMaterial({color:0x39435f}));scene.add(e.post);
 els.push(e);return e}
function removeEl(e){for(const o of[e.g,e.post]){if(!o)continue;scene.remove(o);o.traverse(q=>{q.geometry&&q.geometry.dispose()})}}
function mk(e){const g=new THREE.Group(),t=e.type;
 const P=(c,o)=>new THREE.MeshPhongMaterial({color:c,shininess:90,...o}),
  B=(w,h,d,m,x,y,z,par)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x||0,y||0,z||0);(par||g).add(q);return q},
  CZ=(r,h,m)=>{const q=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,40).rotateX(Math.PI/2),m);g.add(q);return q},
  gl={transparent:true,opacity:.4,depthWrite:false};
 if(t==='laser'){B(.3,.3,.8,P(0x2a3350),0,0,-.1);B(.34,.34,.2,P(0x3b4770),0,0,-.45);
  const c=e.white?[1,1,1]:rgb(e.wl),s=new THREE.Mesh(new THREE.SphereGeometry(.07,12,12),new THREE.MeshBasicMaterial({color:new THREE.Color(...c)}));s.position.z=.32;g.add(s)}
 else if(t==='mirror'){CZ(.6,.04,P(0xdfe8ff,{specular:0xffffff}));CZ(.62,.03,P(0x56627f)).position.z=-.03}
 else if(t==='lens'){const cx=e.f>0,pr=cx?[[0,-.12],[.25,-.1],[.5,-.01],[.5,.01],[.25,.1],[0,.12]]:[[0,-.025],[.25,-.05],[.5,-.1],[.5,.1],[.25,.05],[0,.025]];
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pr.map(p=>new THREE.Vector2(p[0],p[1])),40).rotateX(Math.PI/2),P(0x7fc8ff,{...gl,side:2})))}
 else if(t==='pol'){CZ(.45,.03,P(0xffb35c,{...gl,opacity:.3}));const r=new THREE.Mesh(new THREE.TorusGeometry(.45,.02,6,40),P(0xffb35c));g.add(r);
  const s=new THREE.Group();s.rotation.z=e.al*D;for(let y=-.3;y<=.31;y+=.1)B(.8-Math.abs(y)*.6,.012,.01,P(0xffd9a0),0,y,0,s);g.add(s)}
 else if(t==='split'){CZ(.45,.03,P(0x7ff5d8,{...gl,opacity:.3}));g.add(new THREE.Mesh(new THREE.TorusGeometry(.45,.02,6,40),P(0x7ff5d8)))}
 else if(t==='bbo'){B(.6,.6,.2,P(0xc878ff,{...gl,opacity:.5}));B(.6,.01,.2,P(0xffffff))}
 else if(t==='slit'){const d=e.d/100,w=e.a/100,M=P(0x8892b0),bl=[[-.7,-d/2-w/2],[-d/2+w/2,d/2-w/2],[d/2+w/2,.7]];for(const k of bl)B(k[1]-k[0],1.2,.05,M,(k[0]+k[1])/2,0,0)}
 else if(t==='screen'){e.cvs=document.createElement('canvas');e.cvs.width=512;e.cvs.height=256;e.tex=new THREE.CanvasTexture(e.cvs);e.img=new ImageData(512,256);
  g.add(new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.4),new THREE.MeshBasicMaterial({map:e.tex,side:2})));B(2.5,1.5,.03,P(0x1b2238),0,0,-.025)}
 else if(t==='prism'){const R=.6,sh=new THREE.Shape();for(let k=0;k<3;k++){const a=k*120*D;k?sh.lineTo(R*Math.cos(a),R*Math.sin(a)):sh.moveTo(R,0)}
  const ge=new THREE.ExtrudeGeometry(sh,{depth:1,bevelEnabled:false}).translate(0,0,-.5),m=new THREE.Mesh(ge,P(0xa9d8ff,{...gl,opacity:.35,side:2}));
  m.matrixAutoUpdate=false;m.matrix.makeBasis(new V(1,0,0),new V(0,0,1),new V(0,1,0));g.add(m);
  const ed=new THREE.LineSegments(new THREE.EdgesGeometry(ge),new THREE.LineBasicMaterial({color:0xa9d8ff}));ed.matrixAutoUpdate=false;ed.matrix.copy(m.matrix);g.add(ed)}
 e.ring=new THREE.Mesh(new THREE.TorusGeometry(t==='screen'?1.45:t==='prism'||t==='slit'?.85:t==='laser'?.5:.8,.015,6,56),new THREE.MeshBasicMaterial({color:0x4cc9f0}));g.add(e.ring);
 g.matrixAutoUpdate=false;g.userData.eid=e.id;return g}
function sync(){for(const e of els){frameOf(e);const sig=[e.type,e.f>0,e.d,e.a,e.al,e.white,e.wl].join();
  if(e.sig!==sig){if(e.g){scene.remove(e.g);e.g.traverse(q=>{q.geometry&&q.geometry.dispose()})}e.g=mk(e);scene.add(e.g);e.sig=sig}
  e.g.matrix.makeBasis(e.u,e.v,e.n).setPosition(e.c);e.g.matrixWorldNeedsUpdate=true;e.ring.visible=e===sel;
  e.post.position.set(e.x,e.y/2,e.z);e.post.scale.y=Math.max(.01,e.y-.05)}}
/* Strahlverfolgung in 3D */
function hitPrism(e,r){let best=null;const R=.6;
 for(let k=0;k<3;k++){const a0=k*120*D,a1=(k+1)*120*D,A=e.c.clone().addScaledVector(e.u,R*Math.cos(a0)).addScaledVector(e.n,R*Math.sin(a0)),
  Bp=e.c.clone().addScaledVector(e.u,R*Math.cos(a1)).addScaledVector(e.n,R*Math.sin(a1)),am=(k+.5)*120*D,
  nk=e.u.clone().multiplyScalar(Math.cos(am)).addScaledVector(e.n,Math.sin(am)),dn=r.d.dot(nk);if(Math.abs(dn)<1e-6)continue;
  const t=A.clone().sub(r.p).dot(nk)/dn;if(t<.02||(best&&t>=best.t))continue;
  const q=r.p.clone().addScaledVector(r.d,t),E=Bp.clone().sub(A),s=q.clone().sub(A).dot(E)/E.dot(E),b=q.clone().sub(e.c).dot(e.v);
  if(s>=0&&s<=1&&Math.abs(b)<=.5)best={t,q,nk}}
 return best}
function hit(e,r){if(e.type==='prism')return hitPrism(e,r);
 const dn=r.d.dot(e.n);if(Math.abs(dn)<1e-6)return null;const t=e.c.clone().sub(r.p).dot(e.n)/dn;if(t<.02)return null;
 const q=r.p.clone().addScaledVector(r.d,t),w=q.clone().sub(e.c),a=w.dot(e.u),b=w.dot(e.v),L=LIM[e.type];
 if(L.r?a*a+b*b>L.r*L.r:Math.abs(a)>L.a||Math.abs(b)>L.b)return null;return{t,q,a,b,w}}
function nr(r,p,d,I,pol,fn){d=d.clone().normalize();if(pol){pol=pol.clone();pol.addScaledVector(d,-pol.dot(d));if(pol.lengthSq()<1e-9)pol=null;else pol.normalize()}
 return{p:p,d,wl:r.wl,I,e:pol,dep:r.dep+1,fan:fn||r.fan}}
function rot(d,k,th){return d.clone().multiplyScalar(Math.cos(th)).addScaledVector(new V().crossVectors(k,d),Math.sin(th)).addScaledVector(k,k.dot(d)*(1-Math.cos(th)))}
function trace(){main=[];fan=[];
 for(const e of els)if(e.type==='screen'){e.S=e.S||new Float32Array(512*256*3);e.S.fill(0);e.F=e.F||new Float32Array(512*3);e.F.fill(0);e.fy=128;e.pk=0}
 const st=[],lz=els.find(e=>e.type==='laser');
 if(lz){const ws=lz.white?[410,450,490,530,570,610,650,690]:[lz.wl],ph=lz.pol*D,e0=lz.u.clone().multiplyScalar(Math.cos(ph)).addScaledVector(lz.v,Math.sin(ph));
  for(const w of ws)st.push({p:lz.c.clone().addScaledVector(lz.n,.34),d:lz.n.clone(),wl:w,I:lz.white?.6:1,e:lz.unpol?null:e0.clone(),dep:0,fan:false})}
 let cnt=0;
 while(st.length&&cnt++<5000){const r=st.pop();let best=null,be=null;
  for(const e of els){if(e.type==='laser')continue;const h=hit(e,r);if(h&&(!best||h.t<best.t)){best=h;be=e}}
  const T=best?best.t:40,P=best?best.q:r.p.clone().addScaledVector(r.d,T);
  (r.fan?fan:main).push({a:r.p,b:P,wl:r.wl,I:r.I});
  if(!best||r.dep>14)continue;
  const e=be,t=e.type,n=e.n,dn=r.d.dot(n),sg=dn>0?1:-1;
  if(t==='mirror'){const d=r.d.clone().addScaledVector(n,-2*dn);st.push(nr(r,P,d,r.I*.97,r.e&&r.e.clone().addScaledVector(n,-2*r.e.dot(n))))}
  else if(t==='lens'){if(Math.abs(dn)<.05){st.push(nr(r,P,r.d,r.I,r.e));continue}
   const vel=r.d.clone().addScaledVector(n,-dn).divideScalar(Math.abs(dn));vel.addScaledVector(best.w,-1/e.f);st.push(nr(r,P,n.clone().multiplyScalar(sg).add(vel),r.I*.98,r.e))}
  else if(t==='pol'){const a=e.u.clone().multiplyScalar(Math.cos(e.al*D)).addScaledVector(e.v,Math.sin(e.al*D));a.addScaledVector(r.d,-a.dot(r.d));if(a.lengthSq()<1e-6)continue;a.normalize();
   const I=r.e?r.I*r.e.dot(a)**2:r.I*.5;if(I>.004)st.push(nr(r,P,r.d,I,a))}
  else if(t==='split'){st.push(nr(r,P,r.d,r.I*.5,r.e));st.push(nr(r,P,r.d.clone().addScaledVector(n,-2*dn),r.I*.5,r.e&&r.e.clone().addScaledVector(n,-2*r.e.dot(n))))}
  else if(t==='bbo'){for(const q of[1,-1]){const d=rot(r.d,e.v,q*.1),h=e.u.clone();h.addScaledVector(d,-h.dot(d)).normalize();
    st.push(nr(r,P,d,r.I*.5,q>0?h:new V().crossVectors(d,h)))}}
  else if(t==='slit'){if(Math.abs(best.a)>e.d/200+e.a/100)continue;const lam=r.wl/1000,N=90;
   for(let i=-N;i<=N;i++){const th=i/N*.13,s=Math.sin(th),ph=Math.PI*e.d*s/lam,x=Math.PI*e.a*s/lam,I=r.I*Math.cos(ph)**2*(x?(Math.sin(x)/x)**2:1);
    if(I<.012)continue;st.push(nr(r,P,n.clone().multiplyScalar(sg*Math.cos(th)).addScaledVector(e.u,s),I,r.e,true))}}
  else if(t==='screen'){const px=(best.a/2.4+.5)*512,py=(.5-best.b/1.4)*256,c=rgb(r.wl),ix=Math.round(px),iy=Math.round(py);
   if(r.fan){e.fy=py;for(let k=-3;k<=3;k++){const j=ix+k;if(j<0||j>=512)continue;const w=r.I*.4*Math.exp(-k*k/2.5);e.F[j*3]+=c[0]*w;e.F[j*3+1]+=c[1]*w;e.F[j*3+2]+=c[2]*w}}
   else for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const x=ix+dx,y=iy+dy;if(x<0||x>=512||y<0||y>=256)continue;const w=r.I*Math.exp(-(dx*dx+dy*dy)/6),i=(y*512+x)*3;e.S[i]+=c[0]*w;e.S[i+1]+=c[1]*w;e.S[i+2]+=c[2]*w}}
  else if(t==='prism'){const Nx=best.nk,ent=r.d.dot(Nx)<0,F=ent?Nx.clone():Nx.clone().negate(),ci=-r.d.dot(F),nn=1.45+.02/((r.wl/1000)**2),eta=ent?1/nn:nn,k=1-eta*eta*(1-ci*ci);
   if(k<0)st.push(nr(r,P,r.d.clone().addScaledVector(F,2*ci),r.I,r.e));
   else st.push(nr(r,P,r.d.clone().multiplyScalar(eta).addScaledVector(F,eta*ci-Math.sqrt(k)),r.I*.96,r.e))}}}
/* Darstellung der Strahlen und Schirme */
const dum=new THREE.Object3D(),Y=new V(0,1,0),col=new THREE.Color();
function drawBeams(){let n=0;
