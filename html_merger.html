<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Merger Studio Studio v2</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.btn-secondary {
            background-color: #475569;
        }

        button.btn-secondary:hover {
            background-color: #334155;
        }

        button.btn-danger {
            background-color: #dc2626;
        }

        button.btn-danger:hover {
            background-color: #b91c1c;
        }

        /* Workspace */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 57px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            width: 50%;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            padding: 8px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Mode Switcher Tabs */
        .view-switcher {
            display: flex;
            background-color: #0f172a;
            border-radius: 6px;
            padding: 3px;
            gap: 2px;
        }

        .tab-btn {
            background: transparent;
            color: #94a3b8;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Textareas & Containers */
        textarea {
            flex: 1;
            background-color: #090d16;
            color: #e2e8f0;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .editor-controls {
            padding: 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        /* Right Area Stack */
        .output-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        #masterCodeEditor {
            width: 100%;
            height: 100%;
            display: none; /* Standardmäßig ausgeblendet */
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>HTML Merger Studio v2</h1>
        <div class="action-btns">
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">
                📂 HTML Laden
            </button>
            <input type="file" id="fileInput" accept=".html,.htm" onchange="loadCombinedHtml(event)">

            <button class="btn-secondary" onclick="downloadCombinedHtml()">
                💾 HTML Speichern
            </button>
            
            <button class="btn-danger" onclick="clearAll()">
                🗑️ Zurücksetzen
            </button>
        </div>
    </header>

    <div class="workspace">
        <!-- Linkes Fenster: Schnelleingabe -->
        <div class="panel">
            <div class="panel-header">
                <span>Eingabe (Neues HTML / Fragment)</span>
            </div>
            <textarea id="inputCode" placeholder="Füge hier neuen HTML-Code (oder Snippets mit <style>) ein..."></textarea>
            <div class="editor-controls">
                <button onclick="appendHtml()">
                    ➕ In Gesamtdokument einfügen &rArr;
                </button>
            </div>
        </div>

        <!-- Rechtes Fenster: Vorschau & Editierbarer Master-Code -->
        <div class="panel">
            <div class="panel-header">
                <div class="view-switcher">
                    <button id="btnViewPreview" class="tab-btn active" onclick="switchRightView('preview')">👁️ Vorschau</button>
                    <button id="btnViewCode" class="tab-btn" onclick="switchRightView('code')">💻 Code-Editor</button>
                </div>
                <button class="btn-secondary" onclick="toggleFullscreen()">
                    ⛶ Vollbild
                </button>
            </div>
            <div class="output-container" id="outputContainer">
                <iframe id="previewIframe"></iframe>
                <textarea id="masterCodeEditor" placeholder="Hier steht der Gesamthandler-Code..." oninput="syncFromCodeEditor()"></textarea>
            </div>
        </div>
    </div>

    <script>
        // Interner Speicher für das Gesamtdokument
        let masterDocument = {
            styles: [],
            bodyContent: ""
        };

        const inputCodeEl = document.getElementById('inputCode');
        const iframe = document.getElementById('previewIframe');
        const masterCodeEditor = document.getElementById('masterCodeEditor');
        
        let currentRightView = 'preview'; // 'preview' oder 'code'

        // Initialisierung
        updateAllOutputs();

        // Extrahiert <style>-Tags und Body-Inhalte
        function parseInput(rawHtml) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            
            const styles = Array.from(doc.querySelectorAll('style')).map(s => s.innerHTML);
            let bodyHTML = doc.body ? doc.body.innerHTML : rawHtml;

            // Fallback RegEx für Styles
            const styleRegEx = /<style[\s\S]*?>([\s\S]*?)<\/style>/gi;
            let match;
            while ((match = styleRegEx.exec(rawHtml)) !== null) {
                if (!styles.includes(match[1])) {
                    styles.push(match[1]);
                }
            }
            
            bodyHTML = bodyHTML.replace(/<style[\s\S]*?>[\s\S]*?<\/style>/gi, '');

            return { styles, bodyHTML };
        }

        // Fügt das linke Fragment rechts hinzu
        function appendHtml() {
            const rawCode = inputCodeEl.value.trim();
            if (!rawCode) return;

            const parsed = parseInput(rawCode);

            parsed.styles.forEach(css => {
                masterDocument.styles.push(css);
            });

            masterDocument.bodyContent += (masterDocument.bodyContent ? "\n\n<!-- Neues Element -->\n" : "") + parsed.bodyHTML;

            inputCodeEl.value = "";
            updateAllOutputs();
        }

        // Generiert den vollständigen HTML-String
        function generateFullDocument() {
            const combinedStyles = masterDocument.styles.join("\n\n");
            return `<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zusammengefügtes Dokument</title>
    <style>
${combinedStyles}
    </style>
</head>
<body>
${masterDocument.bodyContent}
</body>
</html>`;
        }

        // Aktualisiert sowohl iFrame als auch Code-Editor
        function updateAllOutputs() {
            const fullDoc = generateFullDocument();
            
            // 1. iFrame aktualisieren
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(fullDoc);
            iframeDoc.close();

            // 2. Editor im rechten Fenster aktualisieren
            masterCodeEditor.value = fullDoc;
        }

        // Wenn direkt im rechten Code-Editor getippt wird
        function syncFromCodeEditor() {
            const editedCode = masterCodeEditor.value;
            
            // iFrame direkt live aktualisieren
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(editedCode);
            iframeDoc.close();

            // Interne Struktur synchronisieren
            const parsed = parseInput(editedCode);
            masterDocument.styles = parsed.styles;
            masterDocument.bodyContent = parsed.bodyHTML;
        }

        // Umschalten zwischen Vorschau und Code-Editor
        function switchRightView(mode) {
            currentRightView = mode;
            const btnPreview = document.getElementById('btnViewPreview');
            const btnCode = document.getElementById('btnViewCode');

            if (mode === 'preview') {
                iframe.style.display = 'block';
                masterCodeEditor.style.display = 'none';
                btnPreview.classList.add('active');
                btnCode.classList.remove('active');
            } else {
                iframe.style.display = 'none';
                masterCodeEditor.style.display = 'block';
                btnPreview.classList.remove('active');
                btnCode.classList.add('active');
            }
        }

        // Datei speichern (Nimmt immer den aktuellen Stand aus dem Textarea/Master)
        function downloadCombinedHtml() {
            const fullDoc = masterCodeEditor.value || generateFullDocument();
            const blob = new Blob([fullDoc], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'zusammengefuegt.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Datei laden
        function loadCombinedHtml(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const parsed = parseInput(content);
                
                masterDocument.styles = parsed.styles;
                masterDocument.bodyContent = parsed.bodyHTML;
                
                updateAllOutputs();
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Vollbild umschalten für den rechten Ausgabebereich
        function toggleFullscreen() {
            const container = document.getElementById('outputContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Alles zurücksetzen
        function clearAll() {
            if (confirm("Möchtest du das gesamte Dokument wirklich zurücksetzen?")) {
                masterDocument = { styles: [], bodyContent: "" };
                inputCodeEl.value = "";
                updateAllOutputs();
            }
        }
    </script>
</body>
</html>
