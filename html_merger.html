<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Merger Studio v3.1 (Sublime Edition)</title>
    
    <!-- CodeMirror Core & Monokai Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --text-color: #f8fafc;
            --border-color: #334155;
            --sublime-bg: #272822;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover { background-color: var(--accent-hover); }
        button.btn-secondary { background-color: #475569; }
        button.btn-secondary:hover { background-color: #334155; }
        button.btn-danger { background-color: #dc2626; }
        button.btn-danger:hover { background-color: #b91c1c; }

        /* Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 57px);
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            width: 50%;
        }

        .panel:last-child { border-right: none; }

        .panel-header {
            padding: 8px 15px;
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Tabs */
        .view-switcher {
            display: flex;
            background-color: #0f172a;
            border-radius: 6px;
            padding: 3px;
            gap: 2px;
        }

        .tab-btn {
            background: transparent;
            color: #94a3b8;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* CodeMirror Overrides für Höhe und Schriftart */
        .CodeMirror {
            height: 100% !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: var(--sublime-bg);
        }

        .editor-controls {
            padding: 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            background-color: var(--panel-bg);
        }

        /* Output Container */
        .output-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        #masterEditorWrapper {
            display: none;
            width: 100%;
            height: 100%;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>HTML Merger Studio v3.1 <span style="font-size:0.7em; color:#a6e22e;">[Sublime Monokai]</span></h1>
        <div class="action-btns">
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">
                📂 HTML Laden
            </button>
            <input type="file" id="fileInput" accept=".html,.htm" onchange="loadCombinedHtml(event)">

            <button class="btn-secondary" onclick="downloadCombinedHtml()">
                💾 HTML Speichern
            </button>
            
            <button class="btn-danger" onclick="clearAll()">
                🗑️ Zurücksetzen
            </button>
        </div>
    </header>

    <div class="workspace">
        <!-- Linkes Fenster: Eingabe -->
        <div class="panel">
            <div class="panel-header">
                <span>Eingabe (Neues HTML / Fragment)</span>
            </div>
            
            <div class="editor-container">
                <textarea id="inputCode"></textarea>
            </div>

            <div class="editor-controls">
                <button onclick="appendHtml()">
                    ➕ In Gesamtdokument einfügen &rArr;
                </button>
            </div>
        </div>

        <!-- Rechtes Fenster: Vorschau & Editierbarer Code -->
        <div class="panel">
            <div class="panel-header">
                <div class="view-switcher">
                    <button id="btnViewPreview" class="tab-btn active" onclick="switchRightView('preview')">👁️ Vorschau</button>
                    <button id="btnViewCode" class="tab-btn" onclick="switchRightView('code')">💻 Code-Editor</button>
                </div>
                <button class="btn-secondary" onclick="toggleFullscreen()">
                    ⛶ Vollbild
                </button>
            </div>
            <div class="output-container" id="outputContainer">
                <iframe id="previewIframe"></iframe>
                
                <div class="editor-container" id="masterEditorWrapper">
                    <textarea id="masterCodeEditor"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- CodeMirror Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <script>
        let masterDocument = { styles: [], bodyContent: "" };

        const iframe = document.getElementById('previewIframe');
        const masterEditorWrapper = document.getElementById('masterEditorWrapper');

        // Initialize CodeMirror Editors
        const inputEditor = CodeMirror.fromTextArea(document.getElementById("inputCode"), {
            mode: "htmlmixed",
            theme: "monokai",
            lineNumbers: true,
            lineWrapping: true,
            tabSize: 2
        });

        const masterEditor = CodeMirror.fromTextArea(document.getElementById("masterCodeEditor"), {
            mode: "htmlmixed",
            theme: "monokai",
            lineNumbers: true,
            lineWrapping: true,
            tabSize: 2
        });

        // Event: Live sync when typing in master editor
        masterEditor.on("change", function(cm, changeObj) {
            if (changeObj.origin !== "setValue") {
                const editedCode = masterEditor.getValue();
                
                // Update iFrame live
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(editedCode);
                iframeDoc.close();

                // Sync internal structure
                const parsed = parseInput(editedCode);
                masterDocument.styles = parsed.styles;
                masterDocument.bodyContent = parsed.bodyHTML;
            }
        });

        // Parse HTML Code
        function parseInput(rawHtml) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            
            const styles = Array.from(doc.querySelectorAll('style')).map(s => s.innerHTML);
            let bodyHTML = doc.body ? doc.body.innerHTML : rawHtml;

            const styleRegEx = /<style[\s\S]*?>([\s\S]*?)<\/style>/gi;
            let match;
            while ((match = styleRegEx.exec(rawHtml)) !== null) {
                if (!styles.includes(match[1])) {
                    styles.push(match[1]);
                }
            }
            
            bodyHTML = bodyHTML.replace(/<style[\s\S]*?>[\s\S]*?<\/style>/gi, '');

            return { styles, bodyHTML };
        }

        // Append Fragment
        function appendHtml() {
            const rawCode = inputEditor.getValue().trim();
            if (!rawCode) return;

            const parsed = parseInput(rawCode);

            parsed.styles.forEach(css => {
                masterDocument.styles.push(css);
            });

            masterDocument.bodyContent += (masterDocument.bodyContent ? "\n\n<!-- Neues Element -->\n" : "") + parsed.bodyHTML;

            inputEditor.setValue("");
            updateAllOutputs();
        }

        // Generate full HTML
        function generateFullDocument() {
            const combinedStyles = masterDocument.styles.join("\n\n");
            return `<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zusammengefügtes Dokument</title>
    <style>
${combinedStyles}
    </style>
</head>
<body>
${masterDocument.bodyContent}
</body>
</html>`;
        }

        // Update Outputs
        function updateAllOutputs() {
            const fullDoc = generateFullDocument();
            
            // iFrame update
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(fullDoc);
            iframeDoc.close();

            // CodeMirror Master Editor update
            masterEditor.setValue(fullDoc);
        }

        // Switch View
        function switchRightView(mode) {
            const btnPreview = document.getElementById('btnViewPreview');
            const btnCode = document.getElementById('btnViewCode');

            if (mode === 'preview') {
                iframe.style.display = 'block';
                masterEditorWrapper.style.display = 'none';
                btnPreview.classList.add('active');
                btnCode.classList.remove('active');
            } else {
                iframe.style.display = 'none';
                masterEditorWrapper.style.display = 'block';
                btnPreview.classList.remove('active');
                btnCode.classList.add('active');
                masterEditor.refresh(); // Refresh layout when visible
            }
        }

        // Download
        function downloadCombinedHtml() {
            const fullDoc = masterEditor.getValue() || generateFullDocument();
            const blob = new Blob([fullDoc], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'zusammengefuegt.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load
        function loadCombinedHtml(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const parsed = parseInput(content);
                
                masterDocument.styles = parsed.styles;
                masterDocument.bodyContent = parsed.bodyHTML;
                
                updateAllOutputs();
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // Fullscreen
        function toggleFullscreen() {
            const container = document.getElementById('outputContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Clear All
        function clearAll() {
            if (confirm("Möchtest du das gesamte Dokument wirklich zurücksetzen?")) {
                masterDocument = { styles: [], bodyContent: "" };
                inputEditor.setValue("");
                updateAllOutputs();
            }
        }

        // Initial render
        updateAllOutputs();
    </script>
</body>
</html>
